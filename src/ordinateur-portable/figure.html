<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordinateur portable</title></head><body>
<script src="core.js"></script>
<script>
/* ============================================================
   Fig. 04 · Ordinateur portable et traitement de texte
   ------------------------------------------------------------
   How it really works (one button per step):
   1. Ouvrir l'écran: the lid turns on its two hinges (closed to ~112°). A magnet in the lid stops facing the sensor in
      the palm rest, the computer wakes: the panel's backlight comes on and the open document is back.
   2. Taper le texte: each key closes a contact under its cap; the keyboard tells the main board which key it was and
      the word processor writes the letter at the cursor (French AZERTY: capitals with Shift, é è à ç on the number
      row, ê with the ^ dead key, the full stop is Shift + ;).
   3. Mettre en forme: the title is selected, then made a heading (bold, larger, centred).
   4. Enregistrer: the document is written to the computer's storage on the main board; the window takes the file's
      name, "Enregistré" shows for a moment. Any later change marks it "(modifié)".
   5. Brancher le chargeur: the USB-C plug goes into the left port; current flows from the charger through the board
      to the battery, the light by the port turns orange (green when full), the battery figure rises.
   On purpose, the inside stays at the level of whole modules (no processor, memory or chips).

   Parts list (1 unit = 1 mm):
   desk: wooden desk top, a mug of coffee, a notebook and a pencil, the charger (brick, USB-C cable, mains cord).
   case: base (rounded, on four rubber feet), deck with keyboard well, 80 keys, speaker grilles, trackpad, two USB-C
         ports and a charge light (left side), headphone jack (right side), exhaust vents (back); lid (cover, bezel,
         screen, webcam).
   inside the base: main board (with the port tab), fan and its duct to the vents, battery (three cells), two
         speakers, trackpad module, hinge leaves, the screen's ribbon cable.
   inside the lid: panel (the screen itself), webcam module, hinge knuckles and leaves, the ribbon cable.
   ============================================================ */

/* ---------- dimensions ---------- */
const DX = 360, DY = 540, BZ = 16;                         // desk top: depth (x), width (y), thickness
const LX0 = 88, LX1 = 303, LY0 = 115, LY1 = 425;           // laptop base footprint, 215 x 310
const ZB0 = BZ + 1.5, ZD = ZB0 + 15;                       // base underside (on its feet), deck top
const LT = 6, LL = 208, HX = LX0 + 7, HZ = ZD + .8 + LT/2; // lid thickness and length, hinge axis
const LID_MAX = 112*Math.PI/180;
const SB = 16, SL = 198, SY0 = LY0 + 9, SY1 = LY1 - 9;     // screen on the lid: s from SB to SL, y from SY0 to SY1
const SCR_W = SY1 - SY0, SCR_H = SL - SB;                  // 292 x 182 (16:10)
const PK = 16.6, KG = 2.6, KX0 = LX0 + 15, KY1 = (LY0 + LY1)/2 + 7.5*PK, KY0 = KY1 - 15*PK, KX1 = KX0 + 5.6*PK;
const TP = [208, 195, 290, 345];                           // trackpad x0 y0 x1 y1
const PORTS = [130, 150], ZPORT = ZB0 + 7.9;               // USB-C ports on the left side
const MUG = { x: 310, y: 60, r: 34, h: 90 };
const NB = [30, 12, 175, 100, 10];                         // notebook x0 y0 x1 y1 height
const BRICK = [200, 448, 250, 498, 26];                    // charger x0 y0 x1 y1 height
const BEZEL = '#1f2226', KEYC = '#2d3137', KEYS = '#16181b';
const DOCF = 'Georgia,&quot;Times New Roman&quot;,serif', UIF = 'system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif';
const deckTop = on(PZ(BZ), rrUV(0, 0, DX, DY, 14));

/* ---------- the document ---------- */
const TITLE = 'Carnet de voyage';
const SENT = ["Ce matin, le TGV a quitté Montparnasse à l'heure.", 'Par la fenêtre, les champs défilaient à toute vitesse.', 'Demain, nous irons voir le volcan !'];
const BODY = SENT.join(' '), FULL = TITLE + '\n' + BODY, B0 = TITLE.length + 1;
const STOPS = [TITLE.length, ...SENT.map((_, i) => B0 + SENT.slice(0, i + 1).join(' ').length)];
const PAGE0 = 50, PAGE1 = 242, TXT0 = 72, TXT_W = 148, BFS = 8, LH = 12;
const _cv = document.createElement('canvas').getContext('2d'), _tw = new Map();
const tw = (str, fs, wt = 400, fam = 'Georgia,"Times New Roman",serif') => { const key = wt + fam + str; let w = _tw.get(key);
  if (w == null){ _cv.font = `${wt} 100px ${fam}`; w = _cv.measureText(str).width/100; _tw.set(key, w); } return w*fs; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const LINES = (() => { const out = []; let cur = '', start = 0, pos = 0;
  for (const w of BODY.split(' ')){ const cand = cur ? cur + ' ' + w : w;
    if (cur && tw(cand, BFS) > TXT_W){ out.push({ text: cur, start }); start = pos; cur = w; } else cur = cand;
    pos += w.length + 1; }
  out.push({ text: cur, start }); return out; })();
const wordsOf = s => (s.match(/[A-Za-zÀ-ÿ0-9']+/g) || []).length;

/* ---------- the keyboard (AZERTY) ---------- */
const KB = [];
(() => {
  const row = (rx, h, list) => { let c = 0; for (const [id, lbl, w = 1, sz = 5.4] of list){ KB.push({ id, lbl, rx, h, c, w, sz }); c += w; } };
  const fw = 15/14;
  row(0, .6, [['esc', 'esc', fw, 3], ...Array.from({ length: 12 }, (_, i) => ['F' + (i + 1), 'F' + (i + 1), fw, 3]), ['power', '', fw, 3]]);
  row(.6, 1, [['²', '²', 1, 4.4], ...'&é"\'(-è_çà)='.split('').map(c => [c, c, 1, 4.6]), ['bksp', 'effacer', 2, 3.2]]);
  row(1.6, 1, [['tab', 'tab', 1.75, 3.2], ...'AZERTYUIOP'.split('').map(c => [c, c]), ['^', '^'], ['$', '$']]);
  row(2.6, 1, [['caps', 'verr. maj', 1.75, 3], ...'QSDFGHJKLM'.split('').map(c => [c, c]), ['ù', 'ù'], ['*', '*']]);
  row(3.6, 1, [['shiftL', 'maj', 1.25, 3.2], ['<', '<'], ...'WXCVBN'.split('').map(c => [c, c]), [',', ','], [';', ';'], [':', ':'], ['!', '!'], ['shiftR', 'maj', 2.75, 3.2]]);
  row(4.6, 1, [['fn', 'fn', 1, 3.2], ['ctrl', 'ctrl', 1, 3.2], ['alt', 'alt', 1, 3.2], ['cmd', 'cmd', 1.25, 3.2], ['space', '', 5.5], ['altgr', 'alt gr', 1.25, 3.2], ['ctrlR', 'ctrl', 1, 3.2], ['left', '', 1]]);
  KB.push({ id: 'enter', lbl: 'entrée', rx: 1.6, h: 2, c: 13.75, w: 1.25, sz: 3 });
  KB.push({ id: 'up', lbl: '', rx: 4.6, h: .5, c: 13, w: 1 }, { id: 'down', lbl: '', rx: 5.1, h: .5, c: 13, w: 1 }, { id: 'right', lbl: '', rx: 4.6, h: 1, c: 14, w: 1 });
  for (const k of KB){ k.x0 = KX0 + k.rx*PK + KG/2; k.x1 = KX0 + (k.rx + k.h)*PK - KG/2; k.y1 = KY1 - k.c*PK - KG/2; k.y0 = KY1 - (k.c + k.w)*PK + KG/2;
    k.xc = (k.x0 + k.x1)/2; k.yc = (k.y0 + k.y1)/2; }
})();
// the keys pressed for each character on a French keyboard
const keysFor = ch => { if (ch === ' ' || ch === ' ') return ['space']; if (ch === '\n') return ['enter'];
  if (/[a-z]/.test(ch)) return [ch.toUpperCase()]; if (/[A-Z]/.test(ch)) return ['shiftL', ch];
  return { 'é': ['é'], 'è': ['è'], 'à': ['à'], 'ç': ['ç'], "'": ["'"], ',': [','], '.': ['shiftR', ';'], '!': ['!'], 'ê': ['^', 'E'], 'ù': ['ù'] }[ch] || []; };

/* ---------- small geometry helpers ---------- */
const lidTh = st => LID_MAX*ease(st.lid);
const lidF = th => { const c = Math.cos(th), s = Math.sin(th); return { sd: [c, 0, s], td: [-s, 0, c] }; };
const LP = (F, s, y, t) => [HX + s*F.sd[0] + t*F.td[0], y, HZ + s*F.sd[2] + t*F.td[2]];
const LUV = [...arcUV(LL - 9, LY0 + 9, 9, -90, 0), ...arcUV(LL - 9, LY1 - 9, 9, 0, 90), ...arcUV(3, LY1 - 3, 3, 90, 180, 3), ...arcUV(3, LY0 + 3, 3, 180, 270, 3)];
const lidRings = F => [LUV.map(([s, y]) => LP(F, s, y, -LT/2)), LUV.map(([s, y]) => LP(F, s, y, LT/2))];
const BR0 = on(PZ(ZB0), rrUV(LX0 + 3, LY0 + 3, LX1 - 3, LY1 - 3, 8)), BR1 = on(PZ(ZB0 + 3.5), rrUV(LX0, LY0, LX1, LY1, 10)), BR2 = on(PZ(ZD), rrUV(LX0, LY0, LX1, LY1, 10));
// an oriented box: corner c and three edge vectors a, b, e; only the faces toward the viewer
function obox(c, a, b, e, m, w = .7, shade = toneI){
  const V = (i, j, k) => [0, 1, 2].map(n => c[n] + i*a[n] + j*b[n] + k*e[n]), ng = v => v.map(x => -x), na = norm(a), nb = norm(b), ne = norm(e);
  return [[ng(na), [V(0,0,0), V(0,1,0), V(0,1,1), V(0,0,1)]], [na, [V(1,0,0), V(1,1,0), V(1,1,1), V(1,0,1)]],
    [ng(nb), [V(0,0,0), V(1,0,0), V(1,0,1), V(0,0,1)]], [nb, [V(0,1,0), V(1,1,0), V(1,1,1), V(0,1,1)]],
    [ng(ne), [V(0,0,0), V(1,0,0), V(1,1,0), V(0,1,0)]], [ne, [V(0,0,1), V(1,0,1), V(1,1,1), V(0,1,1)]]]
    .filter(([n]) => vis(n)).map(([n, q]) => shape(q, shade(n, m), w)).join('');
}
const lbox = (F, s0, s1, y0, y1, t0, t1, m, w) => obox(LP(F, s0, y0, t0), F.sd.map(v => v*(s1 - s0)), [0, y1 - y0, 0], F.td.map(v => v*(t1 - t0)), m, w);
// a cable or a handle: a round tube drawn as two strokes (ink, then colour); a tube's width on screen never changes
function tube(pts, r, col){
  const d = 'M' + pts.map(p => { const q = P(...p); return f(q[0]) + ' ' + f(q[1]); }).join('L'), w = 2*r*CAM_K;
  return `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f(w + 1.8*INK_K)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
// a smooth curve through control points (Catmull-Rom)
function smooth(cp, n = 6){ const out = [cp[0]];
  for (let i = 0; i < cp.length - 1; i++){ const p0 = cp[Math.max(0, i - 1)], p1 = cp[i], p2 = cp[i + 1], p3 = cp[Math.min(cp.length - 1, i + 2)];
    for (let j = 1; j <= n; j++){ const t = j/n, t2 = t*t, t3 = t2*t;
      out.push([0, 1, 2].map(k => .5*(2*p1[k] + (-p0[k] + p2[k])*t + (2*p0[k] - 5*p1[k] + 4*p2[k] - p3[k])*t2 + (-p0[k] + 3*p1[k] - 3*p2[k] + p3[k])*t3))); } }
  return out; }
const boxOf = pts => [[0, 1, 2].map(i => Math.min(...pts.map(p => p[i]))), [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])))];
const ribbon = (pts, hw, col) => { let s = '';
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1];
    s += fill(pd([[a[0], a[1] - hw, a[2]], [b[0], b[1] - hw, b[2]], [b[0], b[1] + hw, b[2]], [a[0], a[1] + hw, a[2]]]), col); }
  return s + line(pts.map(p => [p[0], p[1] - hw, p[2]]), .45) + line(pts.map(p => [p[0], p[1] + hw, p[2]]), .45); };
const ledCol = st => st.plugP < 1 ? '#3b3e42' : st.bat < 100 ? '#f5a524' : '#43c25c';

/* ---------- the screen: drawn flat in its own coordinates (u to the right, v down, in mm), then laid on the lid ---------- */
const sR = (u, v, w, h, c, rx = 0, extra = '') => `<rect x="${f(u)}" y="${f(v)}" width="${f(w)}" height="${f(h)}"${rx ? ` rx="${rx}"` : ''} fill="${c}" ${extra}/>`;
const sT = (u, v, str, fs, col, wt = 400, anchor = 'start', fam = UIF) => `<text x="${f(u)}" y="${f(v)}" font-size="${fs}" fill="${col}" font-weight="${wt}" text-anchor="${anchor}" font-family="${fam}">${esc(str)}</text>`;
const dirty = st => st.saved >= 0 && (Math.floor(st.typed) !== st.saved || (st.fmt >= .6) !== st.savedFmt);
function screenUI(st, now){
  const b = st.scr, acc = PALS[st.pal].l, n = Math.floor(st.typed);
  let s = sR(0, 0, SCR_W, SCR_H, '#121417');
  if (b > .01){
    const tTitle = FULL.slice(0, Math.min(n, TITLE.length)), bt = Math.max(0, n - B0), big = st.fmt >= .6;
    let u = sR(0, 0, SCR_W, SCR_H, '#c8cdd4');
    // the menu bar, with the battery and the clock
    u += sR(0, 0, SCR_W, 8, '#eceef1') + sT(6, 5.7, 'Plume', 4.2, '#1d2024', 700) + sT(22, 5.7, 'Fichier     Édition     Affichage     Insertion     Format', 3.8, '#3a3f45');
    const bw = 9*st.bat/100, chg = st.plugP >= 1;
    u += `<rect x="252" y="2.2" width="10" height="4" rx=".8" fill="none" stroke="#2a2e33" style="stroke-width:.45"/>` + sR(262.3, 3.4, .8, 1.6, '#2a2e33')
      + sR(252.5, 2.7, bw, 3, st.bat < 20 ? '#e2483d' : chg ? '#43c25c' : '#2a2e33', .5)
      + (chg ? `<path d="M257.6 1.9L255.4 4.6L257 4.6L256.4 6.6L258.8 3.8L257.2 3.8Z" fill="#fff" stroke="#2a2e33" style="stroke-width:.3"/>` : '')
      + sT(264.5, 5.7, Math.round(st.bat) + ' %', 3.6, '#2a2e33') + sT(288, 5.7, '10:24', 3.8, '#2a2e33', 600, 'end');
    // the window's title bar
    const name = st.saved < 0 ? 'Sans titre' : st.savedName + (dirty(st) ? ' (modifié)' : '');
    u += sR(0, 8, SCR_W, 11, '#f7f8f9') + [6, 11.5, 17].map((x, i) => `<circle cx="${x}" cy="13.5" r="1.9" fill="${['#ee6a5f', '#f5be4f', '#62c554'][i]}"/>`).join('')
      + sT(SCR_W/2, 15.2, name, 4.6, '#2a2e33', 500, 'middle');
    // the toolbar: save, style, font, size, bold / italic / underline, alignment, list
    const hot = (x, w, on2) => on2 ? sR(x, 21.5, w, 10, acc, 1.4) : '';
    const fm = st.fmt, bOn = fm >= .45 && fm < .95, cOn = fm >= .55 && fm < .95, title1 = fm >= .55 && fm < 1;
    u += sR(0, 19, SCR_W, 15, '#eef0f3') + sR(0, 33.6, SCR_W, .4, '#c9ced5');
    u += `<path d="M5 23.2Q5 22.5 5.7 22.5L11.4 22.5L13 24.1L13 29.8Q13 30.5 12.3 30.5L5.7 30.5Q5 30.5 5 29.8Z" fill="#4a5560"/>` + sR(6.6, 22.5, 3.8, 2.5, '#dfe4ea') + sR(6.3, 26.9, 5.4, 3.6, '#f5f7f9', .3);   // a floppy disk
    u += sR(18, 22.3, 38, 8.4, '#ffffff', 1.2, 'stroke="#c3c8cf" style="stroke-width:.35"') + sT(20.5, 28.1, title1 ? 'Titre 1' : 'Normal', 4, '#2a2e33')
      + `<path d="M51.5 25.6L54.5 25.6L53 27.6Z" fill="#59616b"/>`;
    u += sR(60, 22.3, 36, 8.4, '#ffffff', 1.2, 'stroke="#c3c8cf" style="stroke-width:.35"') + sT(62.5, 28.1, 'Georgia', 4, '#2a2e33', 400, 'start', DOCF);
    u += sR(99, 22.3, 13, 8.4, '#ffffff', 1.2, 'stroke="#c3c8cf" style="stroke-width:.35"') + sT(105.5, 28.1, title1 ? '20' : '12', 4, '#2a2e33', 400, 'middle');
    u += hot(117, 10, bOn) + sT(122, 28.4, 'B', 5.2, '#1d2024', 800, 'middle', DOCF) + sT(134, 28.4, 'I', 5.2, '#1d2024', 400, 'middle', DOCF)
      + `<text x="146" y="28.4" font-size="5.2" fill="#1d2024" text-anchor="middle" font-family="${DOCF}" text-decoration="underline">U</text>`;
    const al = (x, mode) => [0, 1, 2, 3].map(i => { const w = i % 2 ? 5 : 7, x0 = mode === 'l' ? x : mode === 'c' ? x + (7 - w)/2 : x + 7 - w; return sR(x0, 23.6 + i*1.9, w, .7, '#3d444c'); }).join('');
    u += hot(156.5, 10, false) + al(158, 'l') + hot(168.5, 10, cOn) + al(170, 'c') + al(182, 'r');
    u += [0, 1, 2].map(i => `<circle cx="196" cy="${24.2 + i*2.5}" r=".6" fill="#3d444c"/>` + sR(198, 23.9 + i*2.5, 6, .6, '#3d444c')).join('');
    u += sT(212, 28.2, 'A', 5, '#1d2024', 600, 'middle', DOCF) + sR(209, 29.4, 6, 1, acc);
    // the page
    u += sR(PAGE0 + 1.4, 41.4, PAGE1 - PAGE0, 160, 'rgba(0,0,0,.14)') + sR(PAGE0, 40, PAGE1 - PAGE0, 160, '#ffffff');
    const tx0 = TXT0, tb = big ? 66 : 62, by0 = big ? 84 : 76, ink2 = '#1b1d20';
    // selection over the title, then the title as a heading
    if (fm > 0 && fm < .6) u += sR(tx0 - .6, tb - 6.8, tw(TITLE, BFS)*Math.min(1, fm/.4) + 1.2, 9, '#bcd5f7');
    if (big && fm < .95){ const wT = tw(TITLE, 13, 700); u += sR(146 - wT/2 - .8, tb - 11, wT + 1.6, 14.5, '#bcd5f7', 0, `opacity="${f(Math.min(1, (.95 - fm)/.25))}"`); }
    u += big ? sT(146, tb, TITLE, 13, ink2, 700, 'middle', DOCF) : sT(tx0, tb, tTitle, BFS, ink2, 400, 'start', DOCF);
    let cx = tx0 + tw(tTitle, BFS), cy = tb;
    LINES.forEach((L, i) => { const k = Math.max(0, Math.min(L.text.length, bt - L.start)); if (!k) return;
      const t = L.text.slice(0, k); u += sT(tx0, by0 + i*LH, t, BFS, ink2, 400, 'start', DOCF); cx = tx0 + tw(t, BFS); cy = by0 + i*LH; });
    if (n >= B0 && bt === 0){ cx = tx0; cy = by0; }
    if (!(fm > 0 && fm < .95)) u += sR(cx + .3, cy - 6.8, .55, 8.6, ink2, 0, `class="cf-caret" style="animation-delay:-${((now - (st.keyT || 0))/1000).toFixed(2)}s"`);
    // the status bar
    u += sR(0, 174, SCR_W, 8, '#eef0f3') + sR(0, 174, SCR_W, .4, '#c9ced5') + sT(6, 179.4, `Page 1 sur 1      Mots : ${wordsOf(FULL.slice(0, n))}`, 3.8, '#4a5057')
      + sT(286, 179.4, 'Français (France)', 3.8, '#4a5057', 400, 'end');
    // "Enregistré" for a moment after saving
    if (st.saveT >= 0 && st.saveT < 2.2){ const o = Math.min(1, st.saveT/.2, (2.2 - st.saveT)/.35);
      u += `<g opacity="${f(o)}">` + sR(212, 156, 72, 13, '#2a2e33', 3) + `<circle cx="221" cy="162.5" r="3.6" fill="#43c25c"/>`
        + `<path d="M219.2 162.6L220.6 164L223 161.2" fill="none" stroke="#fff" style="stroke-width:.9" stroke-linecap="round" stroke-linejoin="round"/>`
        + sT(228, 164.2, 'Enregistré', 4.8, '#ffffff', 600) + `</g>`; }
    s += `<g opacity="${f(b)}">${u}</g>`;
  }
  // the glass
  return s + `<path d="M${f(SCR_W*.56)} 0L${f(SCR_W*.76)} 0L${f(SCR_W*.44)} ${SCR_H}L${f(SCR_W*.24)} ${SCR_H}Z" fill="#ffffff" opacity=".05"/>`;
}
function screenSvg(st, F, t){
  const O = P(...LP(F, SL, SY1, t)), U = Dv(0, -1, 0), V = Dv(...F.sd.map(v => -v));
  return `<g transform="${txM(O, U, V)}"><clipPath id="scrc"><rect width="${SCR_W}" height="${SCR_H}"/></clipPath><g clip-path="url(#scrc)">${screenUI(st, performance.now())}</g></g>`;
}

/* ---------- the base ---------- */
function keysSvg(st){
  const acc = PALS[st.pal].l, U = Dv(0, -1, 0), V = Dv(1, 0, 0), kd = st.kd || [];
  let s = '';
  for (const k of KB.slice().sort((a, b) => depthOf([a.xc, a.yc, ZD]) - depthOf([b.xc, b.yc, ZD]))){
    const down = kd.includes(k.id), zt = ZD + (down ? .25 : .75);
    const top = on(PZ(zt), rrUV(k.x0 + .3, k.y0 + .3, k.x1 - .3, k.y1 - .3, 1.2, 2));
    s += fill(pd(on(PZ(ZD + .02), rectUV(k.x0, k.y0, k.x1, k.y1))), KEYS) + fill(pd(top), down ? acc : KEYC) + ink(pd(top), .4);
    const tc = down ? INK : '#e6e9ec';
    if (k.lbl) s += `<text transform="${txM(P(k.xc + k.sz*.36, k.yc, zt), U, V)}" font-size="${k.sz}" fill="${tc}" text-anchor="middle" font-family="${UIF}" font-weight="600">${esc(k.lbl)}</text>`;
    // arrow keys and the power key get a small drawn sign
    const g = { left: [[-1.6, 1.8], [1.6, 1.8], [0, -1.8]], right: [[-1.6, -1.8], [1.6, -1.8], [0, 1.8]], up: [[.9, 1.6], [.9, -1.6], [-1.1, 0]], down: [[-.9, 1.6], [-.9, -1.6], [1.1, 0]] }[k.id];
    if (g) s += fill(pd(g.map(([dx, dy]) => [k.xc + dx, k.yc + dy, zt + .01])), tc);
    if (k.id === 'power') s += ink(pd(on(PZ(zt + .01), ellUV(k.xc, k.yc, 1.6, 1.6, 12))), .35);
  }
  return act('keys', s);
}
function sideDetails(st){
  let s = '';

  let s = '';
  for (const [col, side, top] of [[pts.slice(0, half), -1, below('btns')], [pts.slice(half), 1, Math.max(below('stats'), below('xrb'))]]){
    const t0 = Math.max(vb.y + hgt, top);
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, t0); y = c.py; }
    const over = col.length ? col[col.length - 1].py - (vb.y + vb.height - hgt) : 0;
    if (over > 0){ const room = col[0].py - t0; for (const c of col) c.py -= Math.min(over, room); }
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1));
      const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      const px = side < 0 ? vb.x + 3*k + w/2 : vb.x + vb.width - 3*k - w/2, ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex - side*4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`; } }
  return s;
}
const typing = st => st.typeTo > st.typed && st.scr > .9, charging = st => st.plugP >= 1 && st.bat < 100;
function surfaceLabels(st, F){
  const open = st.lid > .5, inV = vis(F.td.map(v => -v)), left = vis([0, 1, 0]), y = (LY0 + LY1)/2;
  return [
    ...(open && inV ? [{ at: LP(F, (SB + SL)/2, 330, -3.1), text: 'ÉCRAN', on: st.scr > .5 }, { at: LP(F, LL - 5.5, y, -3.1), text: 'WEBCAM', on: false }] : []),
    ...(st.lid > .35 ? [{ at: [KX0 + 2.1*PK, KY1 - 6.5*PK, ZD + .8], text: 'CLAVIER', on: typing(st) }, { at: [(TP[0] + TP[2])/2, (TP[1] + TP[3])/2, ZD], text: 'PAVÉ TACTILE', on: false },
      { at: [150, 406, ZD], text: 'HAUT-PARLEURS', on: false }] : []),
    ...(left ? [{ at: [140, LY1, ZPORT], text: 'PORTS USB-C', on: st.plugP >= 1 }, { at: [169, LY1, ZPORT], text: 'VOYANT DE CHARGE', on: charging(st) }] : []),
    { at: [(BRICK[0] + BRICK[2])/2, (BRICK[1] + BRICK[3])/2, BZ + BRICK[4]], text: 'CHARGEUR', on: st.plugP >= 1 } ];
}
function insideLabels(st, F){
  const y = (LY0 + LY1)/2, open = st.lid > .3;
  return [
    { at: [252, 270, ZB0 + 7.5], text: 'BATTERIE', on: charging(st) },
    { at: [150, 340, ZB0 + 6.6], text: 'CARTE MÈRE', on: typing(st) || (st.saveT >= 0 && st.saveT < 1.2) },
    { at: [130, 165, ZB0 + 10], text: 'VENTILATEUR', on: st.scr > .5 },
    { at: [178, 408, ZB0 + 9], text: 'HAUT-PARLEUR', on: false },
    { at: [130, 419, ZB0 + 9.2], text: 'PORT USB-C', on: st.plugP >= 1 },
    { at: [249, 300, ZD - .8], text: 'PAVÉ TACTILE', on: false },
    { at: [KX0 + 2.1*PK, KY1 - 10.5*PK, ZD + .75], text: 'CLAVIER', on: typing(st) },
    { at: [HX, 141, HZ], text: 'CHARNIÈRE', on: false },
    ...(open ? [{ at: LP(F, 120, 200, -2.9), text: "DALLE DE L'ÉCRAN", on: st.scr > .5 }, { at: LP(F, 8, y, .5), text: "NAPPE DE L'ÉCRAN", on: st.scr > .5 },
      { at: LP(F, 202, y + 10, -2.7), text: 'WEBCAM', on: false }] : []) ];
}

/* ---------- the scene ---------- */
function scene(st, m){
  const k = ease(st.xr || 0), F = lidF(lidTh(st));
  const items = [
    { box: [[LX0, LY0, BZ], [LX1, LY1, ZD + .75]], svg: k > 0 ? baseXR(st, m, k) : baseSvg(st, m) },
    { box: lidBox(F), svg: k > 0 ? lidXR(st, m, k, F) : lidSvg(st, m, F) },
    ...deskParts(st) ];
  let s = byDepthG(items);
  if (labelsShown()) s += lcCallouts(k > .6 ? insideLabels(st, F) : surfaceLabels(st, F));
  return s;
}

/* ---------- what happens ---------- */
let ui, looping = false, SIM = false;
function batStep(st, dt){
  const chg = charging(st), per = chg ? .45 : 14;
  if (!chg && !(st.scr > .5 && st.plugP < 1)){ st.batAcc = 0; return; }
  st.batAcc = (st.batAcc || 0) + dt;
  while (st.batAcc >= per){ st.batAcc -= per; st.bat = Math.max(1, Math.min(100, st.bat + (chg ? 1 : -1))); }
}
function tick(st, dt){
  let busy = false;
  st.clock = (st.clock || 0) + dt;
  if (st.lid !== st.lidT){ st.lid = Math.min(1, Math.max(0, st.lid + Math.sign(st.lidT - st.lid)*dt/1.1)); busy = true; }
  const scrT = st.lidT === 1 && st.lid > .8 ? 1 : 0;
  if (st.scr !== scrT){ st.scr = Math.min(1, Math.max(0, st.scr + Math.sign(scrT - st.scr)*dt/.45)); busy = true; }
  const on2 = st.scr >= .99;
  st.kd = [];
  if (st.typeTo > st.typed){ busy = true;
    if (on2){ st.typed = Math.min(st.typeTo, st.typed + dt*24); st.keyT = performance.now();
      const j = Math.floor(st.typed); if (st.typed < st.typeTo && st.typed - j > .25) st.kd = keysFor(FULL[j]); } }
  if (st.fmtOn && st.fmt < 1){ busy = true; if (on2 && Math.floor(st.typed) >= TITLE.length) st.fmt = Math.min(1, st.fmt + dt/1.5); }
  if (st.savePend){ busy = true;
    if (on2){ st.savePend = false; st.saved = Math.floor(st.typed); st.savedFmt = st.fmt >= .6; st.savedName = st.saved >= TITLE.length ? TITLE : 'Mon document'; st.saveT = 0; } }
  if (st.saveT >= 0 && st.saveT < 2.2){ st.saveT += dt; busy = true; }
  if (st.plugP !== st.plug){ st.plugP = Math.min(1, Math.max(0, st.plugP + Math.sign(st.plug - st.plugP)*dt/.9)); busy = true; }
  if (st.scr > 0) st.fanA += dt*(typing(st) ? 9 : 4);
  batStep(st, dt);
  return busy;
}
function run(){ if (looping || SIM) return; looping = true; ui.animate(dt => { const b = tick(ui.st, Math.min(dt, .05)); if (!b) looping = false; return b; }); }
function openLid(st){ st.lidT = 1; run(); }
function closeLid(st){ st.lidT = 0; st.typed = st.typeTo = Math.floor(st.typed); st.savePend = false; run(); }
function typeText(st){
  const from = Math.max(st.typeTo, Math.floor(st.typed)), next = STOPS.find(x => x > from);
  if (next == null) return ui.flash(st.typeTo > st.typed ? 'Le texte est en train de s\'écrire' : 'Le texte est complet : mettez-le en forme ou enregistrez-le');
  st.typeTo = next; if (!st.lidT) st.lidT = 1; run();
}
function formatTitle(st){
  if (st.typeTo < TITLE.length) return ui.flash("Il n'y a encore rien à mettre en forme : tapez d'abord le texte");
  if (st.fmtOn) return ui.flash(st.fmt >= 1 ? 'Le titre est déjà mis en forme' : 'La mise en forme est en cours');
  st.fmtOn = true; if (!st.lidT) st.lidT = 1; run();
}
function saveDoc(st){
  if (Math.max(st.typeTo, Math.floor(st.typed)) === 0) return ui.flash("Le document est vide : tapez d'abord le texte");
  if (st.saved >= 0 && !dirty(st) && !st.savePend && st.typeTo <= st.typed && !(st.fmtOn && st.fmt < 1)) return ui.flash('Le document est déjà enregistré');
  st.savePend = true; if (!st.lidT) st.lidT = 1; run();
}
function setPlug(st, v){ st.plug = v; run(); }

ui = mountFigure({
  fig: '04', turn: 'full', title: 'Ordinateur portable',
  size: [DX, DY, 232], palette: 'mint',
  state: { lid: 0, lidT: 0, scr: 0, typed: 0, typeTo: 0, fmt: 0, fmtOn: false, saveT: -1, savePend: false, saved: -1, savedFmt: false, savedName: '',
    plug: 0, plugP: 0, bat: 64, batAcc: 0, fanA: 0, kd: [], keyT: 0 },
  scene, ground: st => groundSvg(st), groundKey: st => lidTh(st).toFixed(3),
  stats: st => [
    { label: 'Mots', value: String(wordsOf(FULL.slice(0, Math.floor(st.typed)))) },
    { label: st.plugP >= 1 ? 'Batterie (en charge)' : 'Batterie', value: Math.round(st.bat) + ' %' } ],
  buttons: [
    { label: "Ouvrir l'écran", onClick: st => st.lidT ? closeLid(st) : openLid(st) },
    { label: 'Taper le texte', onClick: st => typeText(st) },
    { label: 'Mettre en forme', onClick: st => formatTitle(st) },
    { label: 'Enregistrer', onClick: st => saveDoc(st) },
    { label: 'Brancher le chargeur', onClick: st => setPlug(st, st.plug ? 0 : 1) } ],
  acts: { plug: st => setPlug(st, st.plug ? 0 : 1), keys: st => typeText(st) },
  params: (st, q) => {
    if (q.has('lid')){ st.lid = st.lidT = +q.get('lid'); st.scr = st.lid >= .8 ? 1 : 0; }
    if (q.has('typed')){ st.typed = st.typeTo = Math.min(FULL.length, +q.get('typed')); }
    if (q.has('fmt')){ st.fmt = +q.get('fmt'); st.fmtOn = st.fmt > 0; }
    if (q.has('plug')){ st.plug = st.plugP = +q.get('plug'); }
    for (const k of ['bat', 'scr', 'saveT']) if (q.has(k)) st[k] = +q.get(k);
    if (q.get('saved') === '1'){ st.saved = Math.floor(st.typed); st.savedFmt = st.fmt >= .6; st.savedName = st.saved >= TITLE.length ? TITLE : 'Mon document'; }
  },

xrMount(() => ui, () => '');
// the first and last buttons say what they will do now (open or close, plug or unplug)
(() => { const r0 = ui.render, st = ui.st;
  ui.render = () => { r0(); const bs = document.querySelectorAll('#btns .act'), set = (b, t) => { if (b && b.textContent !== t) b.textContent = t; };
    set(bs[0], st.lidT ? "Fermer l'écran" : "Ouvrir l'écran"); set(bs[4], st.plug ? 'Débrancher le chargeur' : 'Brancher le chargeur'); };

  document.head.appendChild(css);
})();
// tests: ?sim=Ouvrir@0.2,Taper@2&at=5 presses the buttons at those times (s) in a fast simulation, then draws once;
// ?shot=1 hides the page around the drawing; ?bench=1 times a redraw
(() => { const q = new URLSearchParams(location.search), st = ui.st;
  if (q.has('at')){ const acts = { ouvrir: openLid, fermer: closeLid, taper: typeText, mettre: formatTitle, enregistrer: saveDoc, brancher: s => setPlug(s, 1), 'débrancher': s => setPlug(s, 0) };
    const ev = (q.get('sim') || '').split(',').filter(Boolean).map(s => { const [w, t] = s.split('@'); return [acts[w.toLowerCase()], +t]; }).sort((a, b) => a[1] - b[1]);
    SIM = true; let t = 0, i = 0; const end = +q.get('at');

  if (q.get('shot') === '1'){ const cs = document.createElement('style');
    cs.textContent = '.actions,#stats,.vset,.zchip,body>header,.controls,.made-with,.lgd,.toast{visibility:hidden!important}'; document.head.appendChild(cs); }
  if (q.get('bench') === '1'){ const t0 = performance.now(); for (let i = 0; i < 5; i++) ui.render(); document.documentElement.dataset.bench = ((performance.now() - t0)/5).toFixed(1); }
})();
/* ---------- la page en français ---------- */
(() => {
  const tr = { 'Hand-drawn wobble': 'Trait tremblé', 'Colour': 'Couleur', 'View': 'Vue', 'Labels': 'Étiquettes' };
  document.querySelectorAll('.ctl label').forEach(l => { if (tr[l.textContent]) l.textContent = tr[l.textContent]; });
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('vreset', 'Vue de face'); set('vspin', 'Faire pivoter'); set('xrb', 'Transparence'); set('lblb', 'Étiquettes');
  const pn = { mustard: 'moutarde', tomato: 'tomate', mint: 'menthe', cobalt: 'cobalt', blush: 'rose' };
  document.querySelectorAll('#pals .sw').forEach(b => { if (pn[b.title]) b.title = pn[b.title]; });
  const mwl = document.querySelector('.made-with a'); if (mwl) mwl.textContent = 'Fait avec Colorfigures';
  if (/\/figures\/[^/]*$/.test(location.pathname)){
    const hd = document.querySelector('body > header'); if (hd) hd.insertAdjacentHTML('beforeend', '<span><a href="../" style="color:inherit">← Toutes les figures</a></span>');
    if (mwl) mwl.insertAdjacentHTML('beforebegin', '<a href="../">← Toutes les figures</a> · '); }
  addEventListener('load', () => setTimeout(() => {
    for (const [c, t] of [['.zm', 'Dézoomer'], ['.zp', 'Taille normale'], ['.zi', 'Zoomer']]){ const e = document.querySelector(c); if (e) e.setAttribute('aria-label', t); } }, 0));
})();
/* ---------- grand écran et plein écran ---------- */
(() => {
  const css = document.createElement('style');
  css.textContent = `@media (min-width:561px){
      :root{--figw:max(760px,min(1800px,calc((100vh - 250px)*1.3333)))}
      body>header,.stage,#fig,.controls,.made-with,.lgd{max-width:var(--figw)!important}
      html.fs{--figw:min(calc(100vw - 32px),calc((100vh - 24px)*1.3333))}
      html.fs body{padding-top:10px;padding-bottom:10px}
      html.fs body>header,html.fs .controls,html.fs .made-with{display:none!important}}
    @media (min-width:1800px) and (min-height:1050px){.actions,#stats,.vset,.zchip{zoom:1.3}}`;
  css.textContent += `
    .zchip .fsb{display:inline-grid;place-items:center}

  document.head.appendChild(css);
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => ui.render(), 150); });
  const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!enter) return;

  const toggle = () => isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : enter.call(root);
  const icon = out => `<svg viewBox="0 0 16 16" fill="none" stroke="#231e16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${out
    ? 'M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5' : 'M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5'}"/></svg>`;
  let btn = null;
  const sync = () => { root.classList.toggle('fs', isFs());
    if (btn){ btn.innerHTML = icon(isFs()); btn.title = isFs() ? 'Quitter le plein écran (F)' : 'Plein écran (F)'; btn.setAttribute('aria-label', btn.title); }
    dispatchEvent(new Event('resize')); requestAnimationFrame(() => ui.render()); };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('load', () => setTimeout(() => { const chip = document.querySelector('.zchip'); if (!chip) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fsb'; btn.onclick = toggle; chip.prepend(btn); sync(); }, 0));
  addEventListener('keydown', e => { if (e.key.toLowerCase() !== 'f' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); toggle(); });
})();
