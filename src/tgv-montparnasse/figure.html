<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGV au départ de Montparnasse</title></head><body>
<script src="core.js"></script>
<script>
/* Un TGV Duplex au départ de Paris-Montparnasse, voie 3, à la sortie de la dalle du Jardin Atlantique.
   Comment ça marche vraiment (où sont le courant et les voyageur·euse·s après chaque étape) :
   1. Lever le pantographe : la rame est à quai, hors tension. Le conducteur lève le pantographe de la motrice, qui
      vient frotter sous les fils de contact ; le disjoncteur se ferme. Le courant continu 1 500 V part de la
      sous-station, monte par le feeder jusqu'à la caténaire (câble porteur + deux fils de contact), descend par le
      pantographe dans la motrice et revient à la sous-station par les roues et les rails. À l'arrêt, il n'alimente
      que les auxiliaires : éclairage, ventilation, portes.
   2. Afficher la voie : environ 20 minutes avant le départ, le tableau affiche la voie ; les voyageur·euse·s sortent
      du hall, sous la dalle, longent le quai jusqu'à leur voiture et montent par la porte (rame sous tension).
   3. Fermer les portes : deux minutes avant le départ, un signal sonore retentit et les portes se ferment et se
      verrouillent ; qui arrive après reste sur le quai.
   4. Donner le départ : l'agent d'escale donne le départ, le signal s'ouvre (carré rouge -> voie libre verte) et le
      conducteur pousse le manipulateur : les onduleurs alimentent les moteurs de traction, le courant monte à
      quelques milliers d'ampères, la rame s'ébranle et quitte la gare.
   5. Rame suivante : la rame suivante est mise à quai, hors tension, pour le train suivant.
   Pièces (chacune tenue par une autre) :
   VOIE        ballast . traverses . selles . rails (écartement 1 435 mm) . câble de retour vers la sous-station
   GARE        dalle du Jardin Atlantique (poutre, voiles, ouverture sombre vers le hall, gazon, arbres, garde-corps) .
               quai (bord, bande d'éveil de vigilance, rampe) . tableau des départs . horloge . nom de gare .
               candélabres . banc . corbeille . sous-station (bâtiment, transformateur, redresseur, isolateurs)
   CATÉNAIRE   deux poteaux et leurs massifs . consoles et haubans . isolateurs . câble porteur . deux fils de
               contact . pendules . bras de rappel . feeder . signal (mât, cible, feux)
   MOTRICE     caisse et nez . pare-brise . phares . chasse-obstacles . jupes . deux bogies moteurs (roues, châssis)
               . pantographe (isolateurs, bras inférieur et supérieur, archet, bandes de frottement) . disjoncteur .
               ligne de toiture . grilles de ventilation . porte de cabine . conducteur
   DEDANS      cabine (pupitre, manipulateur, siège) . disjoncteur . filtre (self) . transformateur . deux blocs
               onduleurs . quatre moteurs de traction et leurs cardans . ventilateurs . batterie
   VOITURE     caisse Duplex . soufflet . bogies . portes . fenêtres des deux salles ; dedans : planchers, escalier,
               sièges des salles haute et basse, voyageur·euse·s assis·es */

/* ---------- géométrie (x = profondeur, y = le long de la voie, z = haut ; 1 unité = 10 cm) ---------- */
const W = 124, D = 400, H = 212;
const TX = 50, HG = 7.18, BAL = 2.4, TIE = 4, RT = 5.6;              // axe de la voie, demi-écartement, ballast, traverses, rail
const SLABY = 50, SLZ = RT + 180, OPX = [29, 117], OPZ = 86;          // dalle (18 m au-dessus des rails) : face avant, dessus ; ouverture
const PE = TX + 16.5, PX1 = 118, QZ = RT + 5.5, PEND = 330;           // quai : bord, fond, dessus (55 cm), fin
const NY0 = 340;                                                      // nez de la motrice, rame à quai
const MOT = 221.5, GAP = 3, CAR = 187, CAR1 = 218.5;                   // motrice, intervalle, remorque, remorque d'extrémité
const BW = 14.5, MBW = 14.07, ROOF = RT + 41, CROOF = RT + 43;        // demi-largeurs (remorque, motrice), toits
const RW = 4.6, AZ = RT + RW, WX0 = 6.4, WX1 = 7.9;                   // roues (92 cm)
const CWZ = RT + 55, MSZ = 72, MX = TX - 24, MASTS = [110, 290];      // fils de contact, porteur, poteaux
const SIGY = 352, BOARDY = 92, CLOCKY = 196;
const PANTO = 178, PANTO_AC = 116, DJ = 150;                           // pantographes 1,5 kV et 25 kV, disjoncteur (u depuis le nez)
const DOOR = [36, 45];                                                // la porte de chaque voiture, à l'avant de la salle basse
const CAP = 556;                                                      // places d'une rame Océane

const BODY = { l:'#f6f7f6', m:'#d7dbde', d:'#a5adb4' }, IRON = { l:'#8a97a2', m:'#66737e', d:'#414c55' };
const SOOT = { l:'#625d59', m:'#47423e', d:'#2b2724' }, STEEL = { l:'#e3e7e9', m:'#b3babe', d:'#7d868b' };
const TYRE = { l:'#9aa0a4', m:'#73797d', d:'#4b5054' }, CONC = { l:'#e2ddd2', m:'#c6c0b2', d:'#99927f' };
const PLAT = { l:'#d9d5cc', m:'#bdb8ad', d:'#918b7e' }, BRICK = { l:'#d08b6a', m:'#b06e50', d:'#7a4733' };
const GRASS = { l:'#a6cf86', m:'#86b066', d:'#567a3d' }, LEAF = { l:'#7fbf6a', m:'#5e9e4c', d:'#3a6b2e' };
const BARK = { l:'#9c6c43', m:'#7b5230', d:'#4d331d' }, CU = { l:'#f2b27a', m:'#d48a4f', d:'#975a2c' };
const BALLAST = { l:'#d2cabb', m:'#b2aa99', d:'#867e70' }, SLEEPER = { l:'#c9c3b6', m:'#a9a395', d:'#7d776a' };
const RAILM = { l:'#c7ccce', m:'#959b9f', d:'#62686c' }, NAVY = { l:'#3b4f78', m:'#2a3a5c', d:'#1a2540' };
const PORC = { l:'#a8603a', m:'#8a4a2a', d:'#5c2f1a' }, WATERM = { l:'#9fd2f0', m:'#5aa9da', d:'#2f78ad' };
const SEAT = { l:'#6f8fc9', m:'#55729f', d:'#36496b' }, GLASSD = '#2b3640', LIT = '#ffe7a3', AMP = '#ffd23a';
const SKIN = ['#f1c7a5', '#c8946b', '#8d5a3c', '#e8b48f', '#a7714f'], HAIR = ['#3a2a1e', '#1f1a17', '#8a5a2e', '#d9b46a', '#5a4636'];
const CLOTH = ['#e2483d', '#3e86d9', '#f2c230', '#38a565', '#8c4bd1', '#f08a2b', '#4b5563', '#d94f86'];

/* ---------- petits outils ---------- */
let SS = 0;                                                           // avance de la rame (st.s) pour le dessin en cours
const TY = u => NY0 + SS - u;                                         // y d'un point de la rame à u (depuis le nez)
const Tp = (dx, u, z) => [TX + dx, TY(u), z];
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const rbox = (a, b, r, r1 = r) => { const d = norm(sub(b, a)), R = Math.max(r, r1), e = d.map(v => R*Math.sqrt(Math.max(0, 1 - v*v)));
  return [[0,1,2].map(i => Math.min(a[i], b[i]) - e[i]), [0,1,2].map(i => Math.max(a[i], b[i]) + e[i])]; };
const bboxOf = (pts, e = 0) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const xs = (sg, a, b) => { const p = TX + sg*a, q = TX + sg*b; return [Math.min(p, q), Math.max(p, q)]; };
const mw = w => `style="stroke-width:${f(w)}"`;
const strk = (pts, col, w, cap = 'round', extra = '') => `<path d="${pd(pts, false)}" fill="none" stroke="${col}" ${mw(w)} stroke-linecap="${cap}" stroke-linejoin="round" ${extra}/>`;
const cable = (pts, col, w) => strk(pts, INK, w + .4) + strk(pts, col, w);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fr1 = v => v.toFixed(1).replace('.', ',');
const frInt = v => Math.round(v).toLocaleString('fr-FR');
const hhmm = m => { const t = Math.round(m) % 1440; return String(Math.floor(t/60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
function kit(){ const parts = [];
  const put = (b, svg) => { if (svg) parts.push({ box: b, svg }); };
  return { parts, put,
    bx: (x0, y0, z0, x1, y1, z1, M, sh = tone, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, sh, w)),
    rd: (a, b, r, M, sh = tone, w = .8, r1 = r, n = 8) => put(rbox(a, b, r, r1), rod(a, b, r, M, sh, w, r1, n)) }; }
// a thin line (wire, rope, cable) cut into short pieces, each with its own box, so it sorts with the solids it passes
function lineParts(K, pts, col, w, L = 12, edge = true){
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / L));
    for (let j = 0; j < n; j++){ const p = lerp3(a, b, j/n), q = lerp3(a, b, (j + 1)/n); K.put(rbox(p, q, Math.max(.15, w/2)), edge ? cable([p, q], col, w) : strk([p, q], col, w)); } } }
// a long list in depth order: pairs that overlap on screen get an order (separated boxes, all separating axes agreeing;
// else centre depth), parts caught in a cycle (Tarjan) are drawn together by depth, groups in graph order
function lcSort(parts){
  const it = parts.filter(Boolean).map(p => { const b = p.box, X = [], Y = [];
    for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]){ const q = P(x, y, z); X.push(q[0]); Y.push(q[1]); }
    return { p, d: depthOf(boxMid(b)), x0: Math.min(...X), x1: Math.max(...X), y0: Math.min(...Y), y1: Math.max(...Y), out: [], hard: [], i: -1, low: 0, on: false }; });
  for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++){ const a = it[i], b = it[j];
    if (a.x1 <= b.x0 || b.x1 <= a.x0 || a.y1 <= b.y0 || b.y1 <= a.y0) continue;
    let s = 0, clash = false;
    for (let k = 0; k < 3; k++){ if (Math.abs(CAM_V[k]) < 1e-3) continue; const A = a.p.box, B = b.p.box, v = A[1][k] <= B[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? -1 : 1) : B[1][k] <= A[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? 1 : -1) : 0;
      if (v && s && v !== s) clash = true; if (v) s = v; }
    if (clash) continue;
    const hard = !!s; if (!s) s = a.d <= b.d ? -1 : 1;
    const [u, v] = s < 0 ? [a, b] : [b, a]; u.out.push(v); if (hard) u.hard.push(v); }
  let n = 0; const stk = [], comps = [];
  const visit = v => { v.i = v.low = n++; stk.push(v); v.on = true;
    for (const w of v.out){ if (w.i < 0){ visit(w); v.low = Math.min(v.low, w.low); } else if (w.on) v.low = Math.min(v.low, w.i); }
    if (v.low === v.i){ const c = []; let w; do { w = stk.pop(); w.on = false; c.push(w); } while (w !== v); comps.push(c); } };
  for (const v of it.slice().sort((a, b) => a.d - b.d)) if (v.i < 0) visit(v);
  // inside a cycle, separated boxes still keep their order (hard edges); only the depth guesses give way
  const inside = c => { if (c.length < 2) return c; const set = new Set(c), indeg = new Map(c.map(v => [v, 0]));
    for (const v of c) for (const w of v.hard) if (set.has(w)) indeg.set(w, indeg.get(w) + 1);
    const left = new Set(c), out = [];
    while (left.size){ let pick = null;
      for (const v of left) if (!indeg.get(v) && (!pick || v.d < pick.d)) pick = v;
      if (!pick) for (const v of left) if (!pick || v.d < pick.d) pick = v;
      left.delete(pick); out.push(pick); for (const w of pick.hard) if (left.has(w)) indeg.set(w, indeg.get(w) - 1); }
    return out; };
  return comps.reverse().map(c => inside(c).map(v => v.p.svg).join('')).join('');
}
// a turned part round a vertical axis at (x, y), from a profile [[z, r], ...] bottom to top
function lathe(x, y, prof, M, w = 1.1, n = 14, sh = tone){
  const R = prof.map(([z, r]) => on(PZ(z), ellUV(x, y, Math.max(r, .05), Math.max(r, .05), n))); let s = '';
  for (let i = 0; i < R.length - 1; i++) s += loft(R[i], R[i + 1], nr => sh(nr, M));
  s += fill(pd(R[R.length - 1]), sh([0,0,1], M));
  return s + hullInk(R.flat(), w);
}
// a box turned by angle a round the vertical (a suitcase, a bench), centred (cx, cy), half-length hl along a, half-width hw
function obox(cx, cy, z0, z1, hl, hw, a, M, w = .7){
  const c = Math.cos(a), s = Math.sin(a), q = [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw]].map(([l, k]) => [cx + c*l - s*k, cy + s*l + c*k]);
  const B = q.map(([x, y]) => [x, y, z0]), T = q.map(([x, y]) => [x, y, z1]); let out = '';
  for (let i = 0; i < 4; i++){ const j = (i + 1) % 4, n = norm([(q[i][0] + q[j][0])/2 - cx, (q[i][1] + q[j][1])/2 - cy, 0]);
    if (vis(n)) out += shape([B[i], B[j], T[j], T[i]], tone(n, M), w*.6); }
  if (vis([0,0,1])) out += shape(T, tone([0,0,1], M), w*.6);
  return out + hullInk([...B, ...T], w);
}
// a box seen from inside: far walls, the contents, then the near walls see-through
function hollowBox(x0, y0, z0, x1, y1, z1, M, contents, farOp = 1, nearOp = .3, w = .7){
  const F = [[[0,1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1], [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]], [[0,0,-1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  const far = F.filter(([n]) => !vis(n)).map(([n, q]) => fill(pd(q), toneI(n.map(v => -v), M)) + ink(pd(q), w*.6)).join('');
  const near = F.filter(([n]) => vis(n)).map(([n, q]) => fill(pd(q), tone(n, M)) + ink(pd(q), w)).join('');
  return `<g opacity="${farOp}">${far}</g>${contents}<g opacity="${nearOp}">${near}</g>`;
}
// a plate wheel on an axle along x (TGV wheels are solid discs): tyre band, face with its hub toward the viewer
function wheelX(xa, xb, y, z, r, M, ang){
  const A = on(PX(xa), ellUV(y, z, r, r, 18)), B = on(PX(xb), ellUV(y, z, r, r, 18));
  let s = loft(A, B, n => tone(n, TYRE));
  const fx = facing([1,0,0]) ? xb + .02 : facing([-1,0,0]) ? xa - .02 : null;
  if (fx != null){ const nx = fx > xb ? 1 : -1, rg = (rr, dy = 0, dz = 0) => on(PX(fx), ellUV(y + dy, z + dz, rr, rr, 16));
    s += `<path d="${pd(rg(r))}${pd(rg(r*.86).reverse())}" fill="${tone([nx,0,0], TYRE)}" fill-rule="evenodd"/>` + shape(rg(r*.86), tone([nx,0,0], M), .6)
      + shape(rg(r*.3), tone([nx,0,0], STEEL), .6) + ink(pd(rg(r)), .8);
    for (let i = 0; i < 4; i++){ const a = ang + i*Math.PI/2; s += fill(pd(rg(r*.07, r*.55*Math.cos(a), r*.55*Math.sin(a))), INK); } }
  return s + hullInk([...A, ...B], 1.2);
}
// a small disc facing direction n (a lamp, a gauge), as a point list
const discN = (c, n, r, k = 14) => { const u = norm(cross(n, Math.abs(n[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(norm(n), u);
  return Array.from({length:k}, (_, i) => { const t = i/k*2*Math.PI; return [0,1,2].map(j => c[j] + u[j]*Math.cos(t)*r + v[j]*Math.sin(t)*r); }); };
const txSide = (x, y, z, str, size, col, sg, fam = 'ui-monospace,Menlo,monospace', wt = 800) => `<text transform="${txM(P(x, y, z), Dv(0, -sg, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${fam}" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;
const txEnd = (x, y, z, str, size, col, sg, anchor = 'middle', wt = 800) => `<text transform="${txM(P(x, y, z), Dv(sg, 0, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".03em">${str}</text>`;

/* ---------- la voie ---------- */
function trackBed(){
  const pr = [[TX - 15, 0], [TX + 15, 0], [TX + 12.8, BAL], [TX - 12.8, BAL]], A = on(PY(SLABY), pr), B = on(PY(D), pr);
  let s = loft(A, B, n => tone(n, BALLAST));
  if (facing([0,1,0])) s += shape(B, tone([0,1,0], BALLAST), .8);
  const top = [[TX - 12.8, SLABY, BAL + .02], [TX + 12.8, SLABY, BAL + .02], [TX + 12.8, D, BAL + .02], [TX - 12.8, D, BAL + .02]];
  s += `<defs><pattern id="tgGrav" patternUnits="userSpaceOnUse" width="5.3" height="4.1"><path d="M.6 .9l.9-.5.5.8zM3.1 2.2l.8-.4.4.9zM1.4 3.3l.7-.2.2.6zM4.4 .6l.5.1-.3.5z" fill="${BALLAST.d}" opacity=".6"/></pattern></defs>`
    + fill(pd(top), 'url(#tgGrav)') + hullInk([...A, ...B], 1.6);
  const sl = [];
  for (let y = SLABY + 3; y < D - 1; y += 6){
    let t = box(TX - 12.5, y - 1.3, BAL, TX + 12.5, y + 1.3, TIE, SLEEPER, tone, .6);                       // traverses béton
    for (const sg of [-1, 1]) t += fill(pd([[TX + sg*HG - 1.1, y - .9, TIE + .02], [TX + sg*HG + 1.1, y - .9, TIE + .02], [TX + sg*HG + 1.1, y + .9, TIE + .02], [TX + sg*HG - 1.1, y + .9, TIE + .02]]), '#4a4642');
    sl.push({ box: [[TX - 12.5, y - 1.3, BAL], [TX + 12.5, y + 1.3, TIE]], svg: t }); }
  return s + byDepth(sl);
}
function railsSvg(){
  return byDepth([-1, 1].map(sg => { const xc = TX + sg*HG;
    return { box: [[xc - .65, SLABY, TIE], [xc + .65, D, RT]], svg: box(xc - .65, SLABY, TIE, xc + .65, D, TIE + .3, RAILM, tone, .5)
      + box(xc - .18, SLABY, TIE + .3, xc + .18, D, RT - .6, RAILM, tone, .4) + box(xc - .36, SLABY, RT - .6, xc + .36, D, RT, RAILM, tone, .8) }; }));
}
// the far end of the track fades into the paper, so a train can leave the picture
function fadeDefs(){
  let a = P(TX, D - 46, 22), b = P(TX, D - 4, 22); const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (L < 8){ const k = 8/(L || 1); b = [a[0] + (b[0] - a[0])*k || a[0], a[1] + (b[1] - a[1])*k || a[1] + 8]; }
  return `<defs><linearGradient id="tgFadeG" gradientUnits="userSpaceOnUse" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>`
    + `<mask id="tgFade" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="8000" height="8000"><rect x="-4000" y="-4000" width="8000" height="8000" fill="url(#tgFadeG)"/></mask></defs>`;
}

/* ---------- la dalle du Jardin Atlantique ---------- */
function slabParts(K){
  const { put, rd } = K, x0 = OPX[0], x1 = OPX[1];
  let s = box(0, 0, 0, W, SLABY, SLZ, CONC, tone, 1.6);
  if (facing([0,1,0])){ const y = SLABY + .05, fy = [0, 1, 0];
    // the dark way into the hall, under the slab: the track and the platform go in
    s += shape([[x0, y, 0], [PE, y, 0], [PE, y, QZ], [x1, y, QZ], [x1, y, OPZ], [x0, y, OPZ]], '#25211d', 1.2);
    s += fill(pd([[x0 + 1, y + .01, OPZ - 1], [x1 - 1, y + .01, OPZ - 1], [x1 - 1, y + .01, OPZ - 6], [x0 + 1, y + .01, OPZ - 6]]), '#3a352f');
    let ln = ''; for (let z = OPZ + 6; z < SLZ - 2; z += 24) ln += pd([[0, y, z], [W, y, z]], false);
    for (let x = 6; x < W; x += 16) ln += x < x0 || x > x1 ? pd([[x, y, 0], [x, y, SLZ - 4]], false) : pd([[x, y, OPZ], [x, y, SLZ - 4]], false);
    s += `<path d="${ln}" fill="none" stroke="${CONC.d}" ${mw(.3)}/>`;
    for (let z = OPZ + 10; z < SLZ - 12; z += 24) for (let x = 8; x < W - 8; x += 16) s += fill(pd([[x + 1.5, y + .02, z], [x + 13.5, y + .02, z], [x + 13.5, y + .02, z + 7], [x + 1.5, y + .02, z + 7]]), '#4a4640', 'opacity=".75"');
    // track number over the track

/* ---------- la caténaire, le signal ---------- */
const stagger = y => 2*Math.cos(Math.PI*(y - MASTS[0])/(MASTS[1] - MASTS[0]));
const msgZ = y => MSZ - 1.4*Math.pow(Math.sin(Math.PI*(y - MASTS[0])/(MASTS[1] - MASTS[0])), 2);
function catenaryParts(st, K){
  const { put, bx, rd } = K;
  for (const m of MASTS){
    bx(MX - 2, m - 2, 0, MX + 2, m + 2, 1.4, CONC, tone, .7);

    rd([MX + 1.2, m, 74.6], [TX + 6, m, 74.6], .35, STEEL, tone, .6, .35, 8);                                  // console
    rd([MX + 1.2, m, 79], [TX - 4, m, 74.9], .3, STEEL, tone, .5, .3, 8);                                    // hauban
    for (const [p, q] of [[[MX + 2.2, m, 74.6], [MX + 5.2, m, 74.6]], [[MX + 2.4, m, 78.4], [MX + 5.2, m, 77.6]]]){ let ins = '';
      for (let k = 0; k <= 4; k++){ const c = lerp3(p, q, k/4); ins += rod([c[0] - .12, c[1], c[2]], [c[0] + .12, c[1], c[2]], .75, PORC, tone, .4, .75, 10); }
      put(rbox(p, q, .8), ins); }
    const sx = stagger(m);
    rd([TX, m, 74.2], [TX, m, msgZ(m) + .2], .2, STEEL, tone, .4, .2, 6);                                    // suspension du porteur
    rd([TX + 4, m, 74.2], [TX + 4, m, CWZ + 1.2], .25, STEEL, tone, .4, .25, 6);                             // tube de rappel
    rd([TX + 4, m, CWZ + 1.2], [TX + sx, m, CWZ + .2], .2, STEEL, tone, .4, .2, 6);                          // bras de rappel
  }

  for (const d of [-.35, .35]) lineParts(K, ys.map(y => [TX + stagger(y) + d, y, CWZ]), '#b87333', .28, 10);
  for (let y = SLABY + 6; y < D; y += 18){ if (MASTS.some(m => Math.abs(y - m) < 6)) continue;
    K.put([[TX - .3, y - .1, CWZ + 3.4], [TX + .3, y + .1, msgZ(y)]], strk([[TX + stagger(y)*.5, y, CWZ + 3.4], [TX, y, msgZ(y)]], '#6b6152', .14));
    K.put([[TX + stagger(y) - .5, y - .1, CWZ], [TX + stagger(y) + .5, y + .1, CWZ + 3.4]], strk([[TX + stagger(y) - .35, y, CWZ], [TX + stagger(y)*.5, y, CWZ + 3.4], [TX + stagger(y) + .35, y, CWZ]], '#6b6152', .12)); }
  // the signal at the platform end, on the left of the track: a target with its lamps toward the train
  { const x = TX - 13, y = SIGY, lamps = [[0, 23.6], [-1.6, 21.2], [1.6, 21.2], [0, 18.8]];
    let s = rod([x, y, 0], [x, y, 25.5], .5, STEEL, tone, .7, .5, 8) + box(x - 3, y - .4, 16.8, x + 3, y + .4, 25.8, SOOT, tone, 1);

/* ---------- la rame : motrice, voitures Duplex, pantographe ---------- */
const NOSE = [[0, 3.0, 10.5, 15, 2], [3, 7.4, 9, 18, 4.2], [8, 10.2, 8.5, 21.8, 5.4], [16, 12.2, 8.5, 26, 6], [26, 13.4, 8.8, 30.2, 6.2],
  [38, 13.95, 9.5, 34.4, 6], [50, 14.07, 10, 38, 5.8], [62, 14.07, 10, 40.4, 5.6], [72, 14.07, 10, 41, 5.5]];
const secAt = u => { let i = 0; while (i < NOSE.length - 2 && NOSE[i + 1][0] < u) i++; const a = NOSE[i], b = NOSE[i + 1], t = clamp((u - a[0])/(b[0] - a[0]), 0, 1);
  return a.map((v, k) => v + (b[k] - v)*t); };
const prof = (w, zb, zt, r) => rrUV(TX - w, RT + zb, TX + w, RT + zt, r, 6);
const secPts = u => { const [, w, zb, zt, r] = secAt(u); return on(PY(TY(u)), prof(w, zb, zt, r)); };
const PANTO_REST = 2.2;
function pantoGeom(st, pu = PANTO, k = st.panto){
  const h = PANTO_REST + (CWZ - .15 - (ROOF + 2.4) - PANTO_REST)*ease(k), z0 = ROOF + 2.4, P0 = [pu + 8, z0], Hh = [pu - 1, z0 + h];
  const L1 = 11.5, L2 = 12.5, d = Math.hypot(Hh[0] - P0[0], Hh[1] - P0[1]), a = (L1*L1 - L2*L2 + d*d)/(2*d), hh = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const ex = (Hh[0] - P0[0])/d, ez = (Hh[1] - P0[1])/d, K0 = [P0[0] + a*ex, P0[1] + a*ez], Kn = [K0[0] - hh*ez, K0[1] + hh*ex], Kk = [K0[0] + hh*ez, K0[1] - hh*ex];
  const knee = Kn[0] < Kk[0] ? Kn : Kk;                                // the knee points toward the nose
  return { P0, knee, Hh, top: z0 + h + .9 };
}
// k = how far the see-through is on: the shells fade to a ghost (so) and the insides come in (k), all sorted together
function trainParts(st, m, K, k){
  const { put, bx, rd } = K, xr = k > .001, so = 1 - .72*k, KS = wrapK(K, so), front = st.dir > 0, pw = st.power, yLim = SLABY;
  const vis0 = u => TY(u) > yLim;
  // ---- motrice: nose and body (in see-through only the ghost shows them)
  if (vis0(0)){
    let s = '';
    const uEnd = Math.min(MOT - 1.5, NY0 + SS - yLim);
    const us = [...NOSE.map(r => r[0]).filter(u => u < uEnd), Math.min(uEnd, 72), uEnd].filter((u, i, a) => a.indexOf(u) === i).sort((a, b) => a - b);
    for (let i = 0; i < us.length - 1; i++) s += loft(secPts(us[i]), secPts(us[i + 1]), n => tone(n, BODY));
    if (facing([0,1,0])) s += shape(secPts(0), tone([0,1,0], BODY), .6);
    if (uEnd >= MOT - 1.5 && facing([0,-1,0])) s += shape(secPts(MOT - 1.5), tone([0,-1,0], BODY), .8);
    // the coloured band along the side, the windscreen, the headlights, the cab side window, grilles and the cab door
    for (const sg of [1, -1]) if (facing([sg, 0, 0])){ const x = TX + sg*(MBW + .03), u0 = 40, u1 = Math.min(uEnd, 216);
      if (u1 > u0) s += shape([[x, TY(u0), RT + 12.5], [x, TY(u1), RT + 12.5], [x, TY(u1), RT + 15], [x, TY(u0), RT + 15]], m.m, .4);
      s += shape([[x, TY(56), RT + 31], [x, TY(66), RT + 31], [x, TY(66), RT + 36.6], [x, TY(56), RT + 35.4]], GLASSD, .6);
      if (uEnd > 80) s += ink(pd([[x, TY(70), RT + 17], [x, TY(77), RT + 17], [x, TY(77), RT + 36], [x, TY(70), RT + 36]]), .7);
      if (uEnd > 200){ let gr = ''; for (const [a, b] of [[92, 124], [136, 168], [176, 206]]) for (let z = RT + 29; z <= RT + 36; z += 1.4) gr += pd([[x, TY(a), z], [x, TY(b), z]], false);
        s += `<path d="${gr}" fill="none" stroke="${BODY.d}" ${mw(.3)}/>`; } }
    { const top = u => { const pts = secPts(u), c = [TX, TY(u), RT + (secAt(u)[2] + secAt(u)[3])/2]; return pts.slice(10, 18).map(p => lerp3(c, p, 1.012)); };
      const A = top(20), B = top(37.5), poly = [...B, ...A.reverse()], n = norm(cross(sub(B[0], A[A.length - 1]), sub(B[B.length - 1], B[0])));
      if (vis([0, .5, .9])) s += shape(poly, GLASSD, .8)
        + clipTo(poly, lathe(TX - 3.6, TY(45), [[RT + 22, 2], [RT + 28, 2.2], [RT + 29.5, 1.2], [RT + 30, 1.3], [RT + 32, 1.2], [RT + 32.4, .3]], NAVY, .7, 12))   // the driver, seen through it
        + strk([lerp3(A[2], B[2], .2), lerp3(A[4], B[4], .7)], '#ffffff', .35, 'round', 'opacity=".35"'); }
    for (const sg of [-1, 1]){ const c = [TX + sg*6.4, TY(5.5), RT + 13.6], n = norm([sg*.45, .85, .1]);
      if (vis(n)){ const lit = pw > .5, col = !lit ? '#d9dcdc' : front ? '#fff6c8' : '#e2483d';
        s += shape(discN(c, n, 1.25), col, .5) + (lit ? fill(pd(discN(c, n, 2.4)), col, 'opacity=".35"') : ''); } }
    // the plough under the nose
    const plough = [on(PY(TY(1)), prof(4, 4.2, 9.5, 1.6)), on(PY(TY(22)), prof(13, 4.2, 9.5, 2))];
    KS.put([[TX - 13, TY(22), RT + 4.2], [TX + 13, TY(1), RT + 9.5]], loft(plough[0], plough[1], n => tone(n, SOOT)) + (facing([0,1,0]) ? shape(plough[0], tone([0,1,0], SOOT), .5) : '') + hullInk([...plough[0], ...plough[1]], 1));
    const all = us.flatMap(u => secPts(u));
    s += hullInk(all, 2.2);

    cs.textContent = '.actions,#stats,.vset,.zchip,body>header,.controls,.made-with,.lgd,.toast{visibility:hidden!important}'; document.head.appendChild(cs); }
  if (q.get('bench') === '1'){ const t0 = performance.now(); for (let i = 0; i < 5; i++) ui.render(); document.documentElement.dataset.bench = ((performance.now() - t0)/5).toFixed(1); }
})();
/* ---------- la page en français ---------- */
(() => {
  const tr = { 'Hand-drawn wobble': 'Trait tremblé', 'Colour': 'Couleur', 'View': 'Vue', 'Labels': 'Étiquettes' };
  document.querySelectorAll('.ctl label').forEach(l => { if (tr[l.textContent]) l.textContent = tr[l.textContent]; });
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('vreset', 'Vue de face'); set('vspin', 'Faire pivoter'); set('xrb', 'Transparence'); set('lblb', 'Étiquettes');
  const pn = { mustard: 'moutarde', tomato: 'tomate', mint: 'menthe', cobalt: 'cobalt', blush: 'rose' };
  document.querySelectorAll('#pals .sw').forEach(b => { if (pn[b.title]) b.title = pn[b.title]; });
  const mwl = document.querySelector('.made-with a'); if (mwl) mwl.textContent = 'Fait avec Colorfigures';
  // in the gallery (figures/…), a way back to all the figures, at the top and at the bottom
  if (/\/figures\/[^/]*$/.test(location.pathname)){
    const hd = document.querySelector('body > header'); if (hd) hd.insertAdjacentHTML('beforeend', '<span><a href="../" style="color:inherit">← Toutes les figures</a></span>');
    if (mwl) mwl.insertAdjacentHTML('beforebegin', '<a href="../">← Toutes les figures</a> · '); }
  addEventListener('load', () => setTimeout(() => {
    for (const [c, t] of [['.zm', 'Dézoomer'], ['.zp', 'Taille normale'], ['.zi', 'Zoomer']]){ const e = document.querySelector(c); if (e) e.setAttribute('aria-label', t); } }, 0));
})();

/* ---------- grand écran et plein écran ----------
   The page is 760 px wide by default: on a large window the figure grows with the window's height (so it never
   needs scrolling), up to 1800 px. A button beside the zoom chip (or the F key) puts the figure in full screen,
   without the title and the settings, and the figure then fills the screen. */
(() => {
  const css = document.createElement('style');
  css.textContent = `@media (min-width:561px){
      :root{--figw:max(760px,min(1800px,calc((100vh - 250px)*1.3333)))}
      body>header,.stage,#fig,.controls,.made-with,.lgd{max-width:var(--figw)!important}
      html.fs{--figw:min(calc(100vw - 32px),calc((100vh - 24px)*1.3333))}
      html.fs body{padding-top:10px;padding-bottom:10px}
      html.fs body>header,html.fs .controls,html.fs .made-with{display:none!important}}
    @media (min-width:1800px) and (min-height:1050px){.actions,#stats,.vset,.zchip{zoom:1.3}}`;
  css.textContent += `
    .zchip .fsb{display:inline-grid;place-items:center}
    .fsb svg{width:12px;height:12px}`;
  document.head.appendChild(css);
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => ui.render(), 150); });   // label columns sit under the buttons
  const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!enter) return;                                                  // iPhone Safari: no full screen for pages
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const toggle = () => isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : enter.call(root);
  const icon = out => `<svg viewBox="0 0 16 16" fill="none" stroke="#231e16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${out
    ? 'M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5' : 'M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5'}"/></svg>`;
  let btn = null;
  const sync = () => { root.classList.toggle('fs', isFs());
    if (btn){ btn.innerHTML = icon(isFs()); btn.title = isFs() ? 'Quitter le plein écran (F)' : 'Plein écran (F)'; btn.setAttribute('aria-label', btn.title); }
    dispatchEvent(new Event('resize')); requestAnimationFrame(() => ui.render()); };   // labels follow the new size
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('load', () => setTimeout(() => { const chip = document.querySelector('.zchip'); if (!chip) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fsb'; btn.onclick = toggle; chip.prepend(btn); sync(); }, 0));
  addEventListener('keydown', e => { if (e.key.toLowerCase() !== 'f' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); toggle(); });
})();
