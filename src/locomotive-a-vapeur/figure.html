<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locomotive à vapeur</title></head><body>
<script src="core.js"></script>
<script>
/* Locomotive à vapeur 4-4-0 « American » (années 1860, au bois) qui fait le plein d'eau et de bois au château d'eau.
   Comment ça marche vraiment (où est chaque matière après chaque étape) :
   1. Faire le plein d'eau : la locomotive est arrêtée avec la trappe (trou d'homme) du tender juste sous la manche.
      On ouvre le couvercle, on abaisse la manche (son contrepoids remonte le long de la cuve), on tire la corde de la
      vanne : eau de la cuve -> vanne -> manche -> chaussette en toile -> trappe -> caisse à eau en U du tender. Le niveau
      de la cuve baisse (flotteur -> indicateur), celui du tender monte. On ferme la vanne, on relève la manche, on
      referme. La pompe remplit de nouveau la cuve par la colonne d'arrivée.
   2. Charger le bois : les bûches du tas (rangé entre ses piquets le long de la voie) passent par-dessus la paroi du
      tender et tombent dans la soute à bois, au milieu du U.
   3. Nourrir le feu : le chauffeur ouvre la porte du foyer et y jette des bûches prises à l'avant de la soute. Les gaz
      chauds traversent la chaudière par les tubes à fumée vers la boîte à fumée et la cheminée (pare-étincelles).
      L'eau autour du foyer et des tubes bout, la vapeur s'accumule dans le dôme : la pression monte. L'injecteur, sous
      la cabine, pousse l'eau du tender dans la chaudière par le clapet d'alimentation.
   4. Siffler et partir : le régulateur, dans le dôme, laisse passer la vapeur -> tuyau de prise de vapeur -> boîte à
      fumée -> tuyaux de vapeur -> boîtes à tiroir -> cylindres. Le piston pousse sa tige, la crosse glisse entre les
      glissières, la bielle motrice fait tourner la roue motrice avant, la bielle d'accouplement entraîne l'arrière (les
      deux côtés sont calés à 90°). La vapeur usée sort par l'échappement sous la cheminée : un « tchou » par quart de
      tour. Le trajet consomme de l'eau et le feu baisse.
   5. Revenir au château d'eau : marche arrière jusqu'à l'arrêt, trappe de nouveau sous la manche.
   Chiffres (The General, 1855) : roues motrices 60 in (1,52 m), tender 2 000 gal (7 500 L) et 2 t de bois.
   Pièces (chacune tenue par une autre) :
   VOIE        ballast . traverses . selles . deux rails (écartement 1 435 mm)
   LOCO        longerons . foyer . corps cylindrique (bandes laiton) . boîte à fumée et sa porte . cheminée pare-étincelles .
               dôme (sifflet, soupapes) . sablière . cloche et sa fourche . phare et son support . mains courantes . tabliers .
               cabine (plancher, parois, fenêtres, toit, lanterneau) . porte du foyer . manomètre . niveau d'eau .
               levier du régulateur . levier de changement de marche . sièges . traverse avant . chasse-bestiaux
   MÉCANISME   cylindres . boîtes à tiroir . selle . support et glissières . crosses . tiges de piston . bielles motrices .
               bielles d'accouplement . manetons . roues motrices à contrepoids . essieux . bogie (roues, longerons, pivot)
   DEDANS      foyer en cuivre . grille . bûches en feu . tubes à fumée . eau de la chaudière . régulateur et sa tringle .
               tuyau de prise de vapeur . tuyaux de vapeur . tuyère d'échappement . pistons . tiroirs . injecteur . boyau .
               tuyau d'alimentation . clapet
   TENDER      bogies (roues pleines, longerons, boîtes d'essieu, traverses) . longrines . caisse à eau en U . trappe et
               couvercle . soute à bois . planche avant . frein à vis . barre d'attelage . tôle de liaison
   CHÂTEAU D'EAU semelles . 4 poteaux . moises . croix de Saint-André . plancher . cuve en douelles cerclée . toit conique .
               indicateur de niveau . flotteur . colonne d'arrivée . vanne . manche et chaussette . potence, poulie,
               corde et contrepoids . corde de vanne
   TAS DE BOIS piquets . bûches */

/* ---------- géométrie (x = profondeur, y = le long de la voie, z = haut ; 1 unité = 10 cm) ---------- */
const W = 94, D = 212, H = 80;
const TX = 58, HG = 7.18, BAL = 2.4, TIE = 4, RT = 5.6;              // axe de la voie, demi-écartement, ballast, traverses, rail
const TY0 = 16, LOFF = 57, RUN = 42;                                   // arrière du tender à l'arrêt ; u = 0 de la loco ; un départ
const RD = 7.5, AZ = RT + RD, DRV = [10, 34], CRK = 3, MRL = 18;       // roues motrices, essieux, manivelle, bielle motrice
const RBG = 3.8, BAZ = RT + RBG, BOG = [60, 70];                       // bogie
const BZ = 27.5, BR = 5.8, SBR = 6.2, BTOP = BZ + BR, SBTOP = BZ + SBR; // chaudière, boîte à fumée
const CABF = 21.2, CABT = 38.5;
const CYX = 11, CYR = 3, CY0 = 61, CY1 = 71;                           // cylindres
const WX0 = 6.4, WX1 = 7.9;                                            // faces des roues |dx|
const RTW = 4.2, TAZ = RT + RTW, TRK = [12, 42], TAX = [4.5, 19.5, 34.5, 49.5];
const TDK = 19, TTOP = 30.5, TLEN = 54, HV = 8, HRAD = 2.2, WMAX = 14;
const TWX = 15, TWY = TY0 + HV, TKR = 14, TK0 = 45, TK1 = 67, LEGZ = 43.5;
const PIV = [TWX + TKR + 1.2, TWY, 46.5];                              // charnière de la manche
const SPL = Math.hypot(TX - PIV[0], PIV[2] - 34.5), SP_UP = 65, SP_DN = Math.atan2(34.5 - PIV[2], TX - PIV[0]) * 180/Math.PI;
const PUL = [38, TWY, 69.3], PULR = 1.2, CWL = 32;                    // poulie de la potence, longueur de corde
const PILE = { x0: 79, x1: 90, y0: 34, y1: 68, h: 19.6 };
const LOGR = 1.3, LOGL = 11;
const CAP_W = 7500, CAP_T = 13000, CAP_B = 2.0;                        // L dans le tender, L dans la cuve, t de bois

const IRON = { l:'#8597a3', m:'#62737f', d:'#3d4a54' }, BRASS = { l:'#f2cf6b', m:'#cfa845', d:'#8d6d24' };
const STEEL = { l:'#e3e7e9', m:'#b3babe', d:'#7d868b' }, TYRE = { l:'#9aa0a4', m:'#73797d', d:'#4b5054' };
const SOOT = { l:'#625d59', m:'#47423e', d:'#2b2724' }, TIMBER = { l:'#c9ad84', m:'#a68a64', d:'#735d45' };
const STAVE = { l:'#c49766', m:'#9e7548', d:'#684b2d' }, TIN = { l:'#b4b0a8', m:'#8d8981', d:'#5d5a54' };
const BARK = { l:'#9c6c43', m:'#7b5230', d:'#4d331d' }, LOGEND = '#ecca93', LOGRING = '#b98a52';
const BALLAST = { l:'#d2cabb', m:'#b2aa99', d:'#867e70' }, SLEEPER = { l:'#937255', m:'#755a40', d:'#4c3a29' };
const RAILM = { l:'#c7ccce', m:'#959b9f', d:'#62686c' }, CANVAS = { l:'#dccb9f', m:'#bba878', d:'#85754f' };
const COPPER = { l:'#f0a875', m:'#d0844f', d:'#94552c' }, WATERM = { l:'#9fd2f0', m:'#5aa9da', d:'#2f78ad' };
const PLANK = { l:'#b98d5e', m:'#9a7146', d:'#6a4c2d' }, STONE = { l:'#d9d3c6', m:'#bcb5a6', d:'#8f887a' }, GLASS = '#cfe9f0';

/* ---------- petits outils ---------- */
let SS = 0;                                                            // avance du train (st.s) pour le dessin en cours
const LY = u => TY0 + LOFF + SS + u, TYv = v => TY0 + SS + v;
const Lp = (dx, u, z) => [TX + dx, LY(u), z], Tp = (dx, v, z) => [TX + dx, TYv(v), z];
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const rbox = (a, b, r, r1 = r) => { const d = norm(sub(b, a)), R = Math.max(r, r1), e = d.map(v => R*Math.sqrt(Math.max(0, 1 - v*v)));
  return [[0,1,2].map(i => Math.min(a[i], b[i]) - e[i]), [0,1,2].map(i => Math.max(a[i], b[i]) + e[i])]; };
const bboxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
const xs = (sg, a, b) => { const p = TX + sg*a, q = TX + sg*b; return [Math.min(p, q), Math.max(p, q)]; };
const mw = w => `style="stroke-width:${f(w)}"`;                      // trait en unités du modèle (pas remis à l'échelle)
const strk = (pts, col, w, cap = 'round') => `<path d="${pd(pts, false)}" fill="none" stroke="${col}" ${mw(w)} stroke-linecap="${cap}" stroke-linejoin="round"/>`;
const cable = (pts, col, w) => strk(pts, INK, w + .45) + strk(pts, col, w);
const fr1 = v => v.toFixed(1).replace('.', ',');
const frInt = v => Math.round(v).toLocaleString('fr-FR');
const spoutAng = st => (SP_UP + (SP_DN - SP_UP)*ease(st.spout)) * Math.PI/180;
const spoutPt = (st, t) => { const a = spoutAng(st); return [PIV[0] + SPL*t*Math.cos(a), PIV[1], PIV[2] + SPL*t*Math.sin(a)]; };
const woodTop = st => TDK + WMAX*st.wood;
const tWaterZ = st => TDK + .3 + (TTOP - TDK - 1)*st.water/CAP_W;
const towerWaterZ = st => TK0 + .4 + 21*st.tower/CAP_T;

// a bag of sorted parts: put(box, svg); bx / rd add a box or a rod with its box
function kit(){ const parts = [];
  const put = (b, svg) => { if (svg) parts.push({ box: b, svg }); };
  return { parts, put,
    bx: (x0, y0, z0, x1, y1, z1, M, sh = tone, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, sh, w)),
    rd: (a, b, r, M, sh = tone, w = .8, r1 = r, n = 14) => put(rbox(a, b, r, r1), rod(a, b, r, M, sh, w, r1, n)) }; }
// byDepth for long lists: Array.sort with a comparator that is not transitive (box separation, else centre depth) can
// put a part far from where it belongs once there are ~100 of them. Here only pairs that overlap on screen get an
// order (separated boxes first, else depth). The parts caught in a cycle (a strongly connected group, Tarjan) are drawn
// together, by depth; the groups are drawn in their graph order, so a cycle never pulls an unrelated part out of place.
function lcSort(parts){
  const it = parts.filter(Boolean).map(p => { const b = p.box, X = [], Y = [];
    for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]){ const q = P(x, y, z); X.push(q[0]); Y.push(q[1]); }
    return { p, d: depthOf(boxMid(b)), x0: Math.min(...X), x1: Math.max(...X), y0: Math.min(...Y), y1: Math.max(...Y), out: [], i: -1, low: 0, on: false }; });
  for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++){ const a = it[i], b = it[j];
    if (a.x1 <= b.x0 || b.x1 <= a.x0 || a.y1 <= b.y0 || b.y1 <= a.y0) continue;
    // every axis the boxes are separated along must agree; if two disagree, they do not really overlap on screen
    let s = 0, clash = false;
    for (let k = 0; k < 3; k++){ if (Math.abs(CAM_V[k]) < 1e-3) continue; const A = a.p.box, B = b.p.box, v = A[1][k] <= B[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? -1 : 1) : B[1][k] <= A[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? 1 : -1) : 0;
      if (v && s && v !== s) clash = true; if (v) s = v; }
    if (clash) continue;
    if (!s) s = a.d <= b.d ? -1 : 1;
    if (s < 0) a.out.push(b); else b.out.push(a); }
  let n = 0; const stk = [], comps = [];
  const visit = v => { v.i = v.low = n++; stk.push(v); v.on = true;
    for (const w of v.out){ if (w.i < 0){ visit(w); v.low = Math.min(v.low, w.low); } else if (w.on) v.low = Math.min(v.low, w.i); }
    if (v.low === v.i){ const c = []; let w; do { w = stk.pop(); w.on = false; c.push(w); } while (w !== v); comps.push(c); } };
  for (const v of it.slice().sort((a, b) => a.d - b.d)) if (v.i < 0) visit(v);
  // Tarjan finishes a group after every group it leads to, so the reversed list is the drawing order
  return comps.reverse().map(c => c.sort((a, b) => a.d - b.d).map(v => v.p.svg).join('')).join('');
}
// a cable cut into short pieces, each with its own box, so it sorts with the solids it passes
function cableParts(K, pts, col, w, L = 3){
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / L));
    for (let j = 0; j < n; j++){ const p = lerp3(a, b, j/n), q = lerp3(a, b, (j + 1)/n); K.put(rbox(p, q, w/2), cable([p, q], col, w)); } } }

/* ---------- roues, bielles, bûches ---------- */
// a wheel on an axle along x: tyre band, and on the face toward the viewer the tyre ring, spokes (the gaps show what is
// behind), counterweight and hub. nsp = 0: a plate wheel.
function wheelX(xa, xb, y, z, r, M, ang, nsp, cw){
  const A = on(PX(xa), ellUV(y, z, r, r, 30)), B = on(PX(xb), ellUV(y, z, r, r, 30));
  let s = loft(A, B, n => tone(n, TYRE));
  const fx = facing([1,0,0]) ? xb + .02 : facing([-1,0,0]) ? xa - .02 : null;
  if (fx != null){
    const nx = fx > xb ? 1 : -1, rg = rr => on(PX(fx), ellUV(y, z, rr, rr, 30)), pt = (rr, a) => [fx, y + rr*Math.cos(a), z + rr*Math.sin(a)];
    const ri = r*.85, tc = tone([nx,0,0], TYRE), hc = tone([nx,0,0], M);
    s += `<path d="${pd(rg(r))}${pd(rg(ri).reverse())}" fill="${tc}" fill-rule="evenodd"/>`;
    if (!nsp) s += fill(pd(rg(ri)), hc) + ink(pd(rg(r*.55)), .5);
    else {
      s += `<path d="${pd(rg(ri))}${pd(rg(ri*.88).reverse())}" fill="${hc}" fill-rule="evenodd"/>`;
      let sk = ''; for (let i = 0; i < nsp; i++){ const a = ang + (i + .5)*2*Math.PI/nsp; sk += pd([pt(r*.2, a), pt(ri*.9, a)], false); }
      const sw = r*.1;
      s += `<path d="${sk}" fill="none" stroke="${INK}" ${mw(sw + .4)}/><path d="${sk}" fill="none" stroke="${hc}" ${mw(sw)}/>`;
      if (cw){ const pts = [];
        for (let i = 0; i <= 8; i++) pts.push(pt(ri*.88, ang + Math.PI - .6 + 1.2*i/8));
        for (let i = 8; i >= 0; i--) pts.push(pt(r*.42, ang + Math.PI - .6 + 1.2*i/8));
        s += shape(pts, hc, .6); }
      s += ink(pd(rg(ri*.88)), .6);
    }
    s += ink(pd(rg(r)), .9) + ink(pd(rg(ri)), .6);
    s += shape(on(PX(fx + nx*.03), ellUV(y, z, r*.2, r*.2, 14)), hc, .7) + shape(on(PX(fx + nx*.05), ellUV(y, z, r*.08, r*.08, 10)), tone([nx,0,0], STEEL), .5);
    if (cw) s += shape(on(PX(fx + nx*.04), ellUV(y + CRK*Math.cos(ang), z + CRK*Math.sin(ang), r*.19, r*.19, 12)), hc, .6);
  }
  return s + hullInk([...A, ...B], 1.4);
}
// a flat bar (a rod of the running gear) from (y0,z0) to (y1,z1), between x = xa and xb, half-depth hw
function barYZ(y0, z0, y1, z1, xa, xb, hw, M, w = .8){
  const d = norm([0, y1 - y0, z1 - z0]), e = [0, -d[2]*hw, d[1]*hw];
  const q = x => [[x, y0 + e[1], z0 + e[2]], [x, y1 + e[1], z1 + e[2]], [x, y1 - e[1], z1 - e[2]], [x, y0 - e[1], z0 - e[2]]];
  const Q0 = q(xa), Q1 = q(xb), cen = avg([...Q0, ...Q1]), F = [[[-1,0,0], Q0], [[1,0,0], Q1]];
  for (let i = 0; i < 4; i++){ const qd = [Q0[i], Q0[(i+1)%4], Q1[(i+1)%4], Q1[i]];
    let n = norm(cross(sub(qd[1], qd[0]), sub(qd[3], qd[0]))); if (dot(n, sub(avg(qd), cen)) < 0) n = n.map(v => -v); F.push([n, qd]); }
  return F.filter(([n]) => vis(n)).map(([n, qd]) => face(pd(qd), tone(n, M))).join('') + hullInk([...Q0, ...Q1], w);
}
// a log between two points: bark round the side, a pale cut end with its rings on the end toward the viewer
function logSvg(a, b, r = LOGR){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:10}, (_, i) => { const t = i/10*2*Math.PI; return [0,1,2].map(k => p[k] + u[k]*Math.cos(t)*rr + v[k]*Math.sin(t)*rr); });
  const A = ring(a, r), B = ring(b, r), toB = vis(d), cc = toB ? b : a, cap = toB ? B : A;
  let s = loft(A, B, nr => tone(nr, BARK));
  if (vis(toB ? d : d.map(x => -x))) s += fill(pd(cap), LOGEND) + `<path d="${pd(ring(cc, r*.55))}" fill="none" stroke="${LOGRING}" ${mw(.18)}/>` + ink(pd(cap), .5);
  return s + hullInk([...A, ...B], .9);
}
// the half of a horizontal ring (around the boiler axis, in the plane y) that faces the viewer, as a band
function bandY(y, r, col, w){ let s = '', seg = [];
  const flush = () => { if (seg.length > 1) s += strk(seg, INK, w + .4, 'butt') + strk(seg, col, w, 'butt'); seg = []; };
  for (let i = 0; i <= 40; i++){ const a = i/40*2*Math.PI, n = [Math.cos(a), 0, Math.sin(a)];
    if (vis(n)) seg.push([TX + r*n[0], y, BZ + r*n[2]]); else flush(); }
  flush(); return s; }
// a turned part round a vertical axis at (x, y), from a profile [[z, r], ...] bottom to top
function lathe(x, y, prof, M, w = 1.1, n = 22){
  const R = prof.map(([z, r]) => on(PZ(z), ellUV(x, y, Math.max(r, .05), Math.max(r, .05), n))); let s = '';
  for (let i = 0; i < R.length - 1; i++) s += loft(R[i], R[i + 1], nr => tone(nr, M));
  s += fill(pd(R[R.length - 1]), tone([0,0,1], M));
  return s + hullInk(R.flat(), w);
}
// a box seen from inside: far walls, the contents, then the near walls see-through
function hollowBox(x0, y0, z0, x1, y1, z1, M, contents, farOp = 1, nearOp = .3, w = .7){
  const F = [[[0,1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1], [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]], [[0,0,-1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  const far = F.filter(([n]) => !vis(n)).map(([n, q]) => fill(pd(q), toneI(n.map(v => -v), M)) + ink(pd(q), w*.6)).join('');
  const near = F.filter(([n]) => vis(n)).map(([n, q]) => fill(pd(q), tone(n, M)) + ink(pd(q), w)).join('');
  return `<g opacity="${farOp}">${far}</g>${contents}<g opacity="${nearOp}">${near}</g>`;
}
const glass = (pts, op = .3) => fill(pd(pts), CLEAR.l, `opacity="${op}"`);
const txSide = (x, y, z, str, size, col, sg) => `<text transform="${txM(P(x, y, z), Dv(0, -sg, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" letter-spacing=".1em">${str}</text>`;
const txFront = (x, y, z, str, size, col, sg) => `<text transform="${txM(P(x, y, z), Dv(sg, 0, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700">${str}</text>`;

/* ---------- la voie ---------- */
const GRAVEL = (() => { let sd = 7; const r = () => (sd = (sd*16807) % 2147483647) / 2147483647, o = [];
  for (let i = 0; i < 420; i++) o.push([TX - 14.5 + 29*r(), 1 + (D - 2)*r(), r()]); return o; })();
function trackBed(){
  const pr = [[TX - 15, 0], [TX + 15, 0], [TX + 12.8, BAL], [TX - 12.8, BAL]], A = on(PY(0), pr), B = on(PY(D), pr);
  let s = loft(A, B, n => tone(n, BALLAST));
  if (facing([0,-1,0])) s += shape(A, tone([0,-1,0], BALLAST), .8);
  if (facing([0,1,0])) s += shape(B, tone([0,1,0], BALLAST), .8);
  let g = '';
  for (const [x, y, k] of GRAVEL){ const z = Math.abs(x - TX) < 12.8 ? BAL + .02 : BAL*(15 - Math.abs(x - TX))/2.2 + .02;
    if (Math.abs(x - TX) >= 12.8 && !facing([Math.sign(x - TX), 0, .9])) continue;
    const q = .35 + .3*k; g += pd([[x - q, y, z], [x + q, y, z], [x, y + q, z]]); }
  s += fill(g, BALLAST.d, 'opacity=".55"') + hullInk([...A, ...B], 1.6);
  const sl = [];
  for (let y = 3; y < D - 1; y += 6){

  st.puffs = st.puffs.filter(p => p.age < p.life);
  return !!(st.fill || st.loadQ || st.feedQ || st.logs.length || st.door > 0 || st.mv || st.go || st.whistle > 0 || st.safety > 0
    || st.puffs.length || Math.abs(st.p - fireTarget(st)) > .005 || st.tower < CAP_T);
}
let SIM = false;                                                       // test fast-forward: no animation loop
function run(){ if (looping || SIM) return; looping = true;
  ui.animate(dt => { const busy = tick(ui.st, Math.min(dt, .05)); if (!busy) looping = false; return busy; }); }
const busyMoving = st => st.mv || st.go;
function fillWater(st){
  if (busyMoving(st)) return ui.flash('La locomotive roule encore');
  if (st.s > .5) return ui.flash("Revenez d'abord sous le château d'eau");
  if (st.fill) return ui.flash('Le plein est en cours');
  if (st.water >= CAP_W - 20) return ui.flash("Le tender est déjà plein d'eau");
  if (st.tower < 300) return ui.flash("La cuve est vide : la pompe la remplit");
  st.fill = 'open'; st.fillT = 0; run();
}
function loadWood(st){
  if (busyMoving(st)) return ui.flash('La locomotive roule encore');
  if (st.s > .5) return ui.flash("Le tas de bois est au château d'eau : revenez-y");
  const fl = loadInFlight(st);
  if (st.wood + fl/16 >= .99) return ui.flash(fl ? 'Chargement en cours' : 'La soute à bois est pleine');
  if (st.pile < .02) return ui.flash('Le tas de bois est vide');
  st.loadQ += Math.min(Math.ceil((1 - st.wood)*16 - fl - .01), Math.floor(st.pile*40 + 1e-6)); st.loadT = 0; run();
}
function feedFire(st){
  if (st.feedQ > 0) return;
  if (st.wood < 1/40 - 1e-6) return ui.flash("Plus de bois dans le tender : chargez-en d'abord");
  if (st.fire >= .99){ st.safety = 1.6; run(); return ui.flash('Le feu est au maximum : la soupape lâche la vapeur en trop'); }
  st.feedQ = Math.min(3, Math.floor(st.wood*40 + 1e-6)); st.feedT = 0; run();
}
function depart(st){
  if (busyMoving(st)) return;
  if (st.s > .5) return ui.flash("La locomotive est déjà partie : ramenez-la au château d'eau");
  if (st.fill) return ui.flash("Attendez la fin du plein d'eau");
  if (loadInFlight(st)) return ui.flash('Attendez la fin du chargement du bois');
  if (st.p < 6) return ui.flash(`Pression trop basse (${fr1(st.p)} bar) : nourrissez le feu`);
  if (st.water < 2500) return ui.flash("Pas assez d'eau dans le tender : faites le plein");
  st.whistle = .9; st.go = { to: RUN, T: 4.6, water: 2300, df: .35 }; run();
}
function goBack(st){
  if (busyMoving(st)) return;
  if (st.s < .5) return ui.flash("La locomotive est déjà au château d'eau");
  if (st.p < 4) return ui.flash(`Pression trop basse (${fr1(st.p)} bar) : nourrissez le feu`);
  if (st.water < 700) return ui.flash("Plus assez d'eau pour rouler");
  st.whistle = .45; st.go = { to: 0, T: 4.2, water: 700, df: .15 }; run();
}

ui = mountFigure({
  fig: '01', turn: 'full', title: 'Locomotive à vapeur',
  size: [W, D, H], palette: 'tomato', credit: true,
  state: { s: 0, water: 1600, wood: .15, pile: 1, tower: CAP_T, fire: .25, p: 3.75, spout: 0, hatch: 0, valve: 0, flow: 0, fill: null, fillT: 0,
    loadQ: 0, loadT: 0, feedQ: 0, feedT: 0, door: 0, logs: [], puffs: [], mv: null, go: null, whistle: 0, safety: 0, chuff: 0, clock: 0, seq: 0, pump: false },
  scene,
  stats: st => [
    { label: 'Eau du tender', value: frInt(Math.round(st.water/10)*10) + ' L' },
    { label: 'Bois', value: fr1(st.wood*CAP_B) + ' t', small: true },
    { label: 'Pression', value: fr1(st.p) + ' bar', small: true } ],
  buttons: [
    { label: "Faire le plein d'eau", onClick: st => fillWater(st) },
    { label: 'Charger le bois', onClick: st => loadWood(st) },
    { label: 'Nourrir le feu', onClick: st => feedFire(st) },
    { label: 'Siffler et partir', onClick: st => depart(st) },
    { label: "Revenir au château d'eau", onClick: st => goBack(st) } ],
  acts: { spout: st => fillWater(st), pile: st => loadWood(st), door: st => feedFire(st) },
  params: (st, q) => {
    for (const k of ['s', 'water', 'wood', 'pile', 'tower', 'fire', 'p', 'spout', 'hatch', 'door']) if (q.has(k)) st[k] = +q.get(k);
    if (q.get('flow') === '1'){ st.spout = st.hatch = st.valve = st.flow = 1; }
    if (q.has('fire') && !q.has('p')) st.p = fireTarget(st);
  },
});
xrMount(() => ui, () => '');
// tests: ?sim=Faire@0.3,Charger@7&at=9 presses the buttons at those times (s) in a fast simulation, then draws once;
// ?bench=1 times a full redraw (<html data-bench="ms">); ?shot=1 hides the page around the drawing
(() => { const q = new URLSearchParams(location.search), st = ui.st;
  if (q.has('at')){ const acts = { faire: fillWater, charger: loadWood, nourrir: feedFire, siffler: depart, revenir: goBack };
    const ev = (q.get('sim') || '').split(',').filter(Boolean).map(s => { const [w, t] = s.split('@'); return [acts[w.toLowerCase()], +t]; }).sort((a, b) => a[1] - b[1]);
    SIM = true; let t = 0, i = 0; const end = +q.get('at');
    while (t < end){ while (i < ev.length && ev[i][1] <= t) ev[i++][0](st); tick(st, 1/60); t += 1/60; }
    SIM = false; ui.render(); }
  if (q.get('shot') === '1'){ const cs = document.createElement('style');   // ?shot=1: the drawing alone, for thumbnails
    cs.textContent = '.actions,#stats,.vset,.zchip,body>header,.controls,.made-with,.lgd,.toast{visibility:hidden!important}'; document.head.appendChild(cs); }
  if (q.get('bench') === '1'){ const t0 = performance.now(); for (let i = 0; i < 5; i++) ui.render(); document.documentElement.dataset.bench = ((performance.now() - t0)/5).toFixed(1); }
})();
/* ---------- la page en français ---------- */
(() => {
  const tr = { 'Hand-drawn wobble': 'Trait tremblé', 'Colour': 'Couleur', 'View': 'Vue', 'Labels': 'Étiquettes' };
  document.querySelectorAll('.ctl label').forEach(l => { if (tr[l.textContent]) l.textContent = tr[l.textContent]; });
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('vreset', 'Vue de face'); set('vspin', 'Faire pivoter'); set('xrb', 'Transparence'); set('lblb', 'Étiquettes');
  const pn = { mustard: 'moutarde', tomato: 'tomate', mint: 'menthe', cobalt: 'cobalt', blush: 'rose' };
  document.querySelectorAll('#pals .sw').forEach(b => { if (pn[b.title]) b.title = pn[b.title]; });
  const mwl = document.querySelector('.made-with a'); if (mwl) mwl.textContent = 'Fait avec Colorfigures';
  // in the gallery (figures/…), a way back to all the figures, at the top and at the bottom
  if (/\/figures\/[^/]*$/.test(location.pathname)){
    const hd = document.querySelector('body > header'); if (hd) hd.insertAdjacentHTML('beforeend', '<span><a href="../" style="color:inherit">← Toutes les figures</a></span>');
    if (mwl) mwl.insertAdjacentHTML('beforebegin', '<a href="../">← Toutes les figures</a> · '); }
  addEventListener('load', () => setTimeout(() => {
    for (const [c, t] of [['.zm', 'Dézoomer'], ['.zp', 'Taille normale'], ['.zi', 'Zoomer']]){ const e = document.querySelector(c); if (e) e.setAttribute('aria-label', t); } }, 0));
})();
/* ---------- grand écran et plein écran ----------
   The page is 760 px wide by default: on a large window the figure grows with the window's height (so it never
   needs scrolling), up to 1800 px. A button beside the zoom chip (or the F key) puts the figure in full screen,
   without the title and the settings, and the figure then fills the screen. */
(() => {
  const css = document.createElement('style');
  css.textContent = `@media (min-width:561px){
      :root{--figw:max(760px,min(1800px,calc((100vh - 250px)*1.3333)))}
      body>header,.stage,#fig,.controls,.made-with,.lgd{max-width:var(--figw)!important}
      html.fs{--figw:min(calc(100vw - 32px),calc((100vh - 24px)*1.3333))}
      html.fs body{padding-top:10px;padding-bottom:10px}
      html.fs body>header,html.fs .controls,html.fs .made-with{display:none!important}}
    @media (min-width:1800px) and (min-height:1050px){.actions,#stats,.vset,.zchip{zoom:1.3}}`;
  css.textContent += `
    .zchip .fsb{display:inline-grid;place-items:center}
    .fsb svg{width:12px;height:12px}`;
  document.head.appendChild(css);
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => ui.render(), 150); });   // label columns sit under the buttons
  const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!enter) return;                                                  // iPhone Safari: no full screen for pages
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const toggle = () => isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : enter.call(root);
  const icon = out => `<svg viewBox="0 0 16 16" fill="none" stroke="#231e16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${out
    ? 'M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5' : 'M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5'}"/></svg>`;
  let btn = null;
  const sync = () => { root.classList.toggle('fs', isFs());
    if (btn){ btn.innerHTML = icon(isFs()); btn.title = isFs() ? 'Quitter le plein écran (F)' : 'Plein écran (F)'; btn.setAttribute('aria-label', btn.title); }
    dispatchEvent(new Event('resize')); requestAnimationFrame(() => ui.render()); };   // labels follow the new size
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('load', () => setTimeout(() => { const chip = document.querySelector('.zchip'); if (!chip) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fsb'; btn.onclick = toggle; chip.prepend(btn); sync(); }, 0));
  addEventListener('keydown', e => { if (e.key.toLowerCase() !== 'f' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); toggle(); });
})();
