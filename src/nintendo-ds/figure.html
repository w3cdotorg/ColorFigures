<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nintendo DS</title></head><body>
<script src="core.js"></script>
<script>
/* ============================================================
   Fig. 05 · Nintendo DS (DS Lite) et cartouche Pokémon
   ------------------------------------------------------------
   How it really works (one button per step):
   1. Ouvrir la console: the top half turns on its hinge barrel (closed to ~150°). Lying flat, the bottom half shows the
      touch screen, the D-pad, A B X Y, START and SELECT; the top half the second screen and the two speakers.
   2. Insérer la cartouche: the DS game card is taken from its case, turned label side down (Nintendo: "label facing the
      bottom of the system") and pushed contacts first into SLOT-1 on the back edge, until it clicks. Only with the
      power off.
   3. Allumer: the power switch on the right side is slid and springs back; the power light turns green, both screens
      light up with the health and safety warning ("touch the touch screen to continue").
   4. Lancer le jeu: the stylus comes out of its silo (right side, along the back edge); a touch on the warning opens
      the DS menu, a touch on the game card's panel starts the game: the console reads it from the card (contacts,
      SLOT-1 connector, main board, ribbon to the top screen); logo, then the title screen.
   5. Appuyer sur START: the game begins in its first town; the D-pad then walks the hero.
   Closing the lid while it is on puts the console to sleep (screens off, the power light blinks).
   Kept at the level of whole modules on purpose: no processor or memory chips.

   Parts list (1 unit = 1 mm; DS Lite 133 x 74 x 21.5 closed, screens 62 x 46 = 256 x 192 pixels):
   desk: wooden desk top, the game's case (closed, cover art), the game card lying on it.
   bottom half: body (rounded, four small feet), touch screen and frame, D-pad, A B X Y, START, SELECT, power and charge
         lights, microphone, hinge cradle; back: SLOT-1, power socket, L and R; front: SLOT-2 (Game Boy Advance) with its
         cover, headphone and microphone jacks, volume slider; right side: power switch, stylus silo.
   top half: body, hinge barrel, top screen and frame, two speaker grilles, logo on the cover.
   inside the bottom half: main board, battery, SLOT-1 connector (rails and contacts), SLOT-2 connector, touch screen
         module, button contact pads, power switch, L / R switches, stylus in its silo, microphone, ribbon cable.
   inside the top half: top screen module, two speakers, the ribbon cable through the hinge.
   ============================================================ */

/* ---------- dimensions ---------- */
const DX = 205, DY = 325, BZ = 12;                                   // desk top: depth (x), width (y), thickness
const LX0 = 100, LX1 = 174, YM = 95, LY0 = YM - 66.5, LY1 = YM + 66.5; // console footprint, 74 x 133
const ZB0 = BZ + .8, ZD = ZB0 + 10.4, ZK = ZD + 1.4;                 // bottom half: underside, top face, top of its buttons
const LT = 10.4, HX = LX0 + 5.3, HZ = ZK + .1 + LT/2, LL = LX1 - HX, LID_MAX = 150*Math.PI/180;
const SCW = 62, SCH = 46, BSX0 = 116, TS0 = 15, TS1 = TS0 + SCH;      // screens; touch screen's back edge; top screen on the lid (s)
const DP = [134, YM + 48], AB = [134, YM - 48];                       // D-pad and A B X Y centres
const ABXY = [['X', -7.2, 0], ['B', 7.2, 0], ['Y', 0, 7.2], ['A', 0, -7.2]];
const STS = [['start', 151, YM - 41], ['select', 157.5, YM - 41]];
const SLOT = [YM + 5, YM + 40], ZS0 = ZB0 + 1.9, CA = 33, CB = 35, CE = 3.8;   // SLOT-1 opening (y), card bottom, card size
const CIN = [LX0 + 15, YM + 22.5, ZS0 + CE/2];                       // the card's centre once in (1.5 mm stays out)
const SX = 104.5, SZ = ZB0 + 8.1, SLEN = 82;                         // stylus silo axis, stylus length
const CASE = [50, 187, 183, 308, 14];                                // game case x0 x1 y0 y1 thickness
const CON = [158, 222, BZ + CASE[4] + CE/2 + .02];                   // the card lying on the case
const SCRF = '#24272b', OFF = '#2e3433';
const UIF = 'system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif', PXF = 'ui-monospace,Menlo,Consolas,monospace', BIGF = '&quot;Arial Black&quot;,Impact,system-ui,sans-serif';
const deckTop = on(PZ(BZ), rrUV(0, 0, DX, DY, 12));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ---------- small geometry helpers ---------- */
const lidTh = st => LID_MAX*ease(st.lid);
const lidF = th => { const c = Math.cos(th), s = Math.sin(th); return { sd: [c, 0, s], td: [-s, 0, c] }; };
const LP = (F, s, y, t) => [HX + s*F.sd[0] + t*F.td[0], y, HZ + s*F.sd[2] + t*F.td[2]];
const LUV = [...arcUV(LL - 8, LY0 + 8, 8, -90, 0), ...arcUV(LL - 8, LY1 - 8, 8, 0, 90), ...arcUV(1.5, LY1 - 1.5, 1.5, 90, 180, 3), ...arcUV(1.5, LY0 + 1.5, 1.5, 180, 270, 3)];
const lidRings = F => [LUV.map(([s, y]) => LP(F, s, y, -LT/2)), LUV.map(([s, y]) => LP(F, s, y, LT/2))];
const BR0 = on(PZ(ZB0), rrUV(LX0 + 2, LY0 + 2, LX1 - 2, LY1 - 2, 6)), BR1 = on(PZ(ZB0 + 1.6), rrUV(LX0, LY0, LX1, LY1, 8)), BR2 = on(PZ(ZD), rrUV(LX0, LY0, LX1, LY1, 8));
const add3 = (a, b, k = 1) => a.map((v, i) => v + b[i]*k), lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const boxOf = pts => [[0, 1, 2].map(i => Math.min(...pts.map(p => p[i]))), [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])))];
// an oriented box: corner c and three edge vectors a, b, e; only the faces toward the viewer
function obox(c, a, b, e, m, w = .7, shade = toneI){
  const V = (i, j, k) => [0, 1, 2].map(n => c[n] + i*a[n] + j*b[n] + k*e[n]), ng = v => v.map(x => -x), na = norm(a), nb = norm(b), ne = norm(e);
  return [[ng(na), [V(0,0,0), V(0,1,0), V(0,1,1), V(0,0,1)]], [na, [V(1,0,0), V(1,1,0), V(1,1,1), V(1,0,1)]],
    [ng(nb), [V(0,0,0), V(1,0,0), V(1,0,1), V(0,0,1)]], [nb, [V(0,1,0), V(1,1,0), V(1,1,1), V(0,1,1)]],
    [ng(ne), [V(0,0,0), V(1,0,0), V(1,1,0), V(0,1,0)]], [ne, [V(0,0,1), V(1,0,1), V(1,1,1), V(0,1,1)]]]
    .filter(([n]) => vis(n)).map(([n, q]) => shape(q, shade(n, m), w)).join('');
}
const lbox = (F, s0, s1, y0, y1, t0, t1, m, w) => obox(LP(F, s0, y0, t0), F.sd.map(v => v*(s1 - s0)), [0, y1 - y0, 0], F.td.map(v => v*(t1 - t0)), m, w);
const ribbon = (pts, hw, col) => { let s = '';
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1];
    s += fill(pd([[a[0], a[1] - hw, a[2]], [b[0], b[1] - hw, b[2]], [b[0], b[1] + hw, b[2]], [a[0], a[1] + hw, a[2]]]), col); }
  return s + line(pts.map(p => [p[0], p[1] - hw, p[2]]), .45) + line(pts.map(p => [p[0], p[1] + hw, p[2]]), .45); };
// a point of the touch screen, from its pixel (px to the right, py down)
const ptB = (px, py) => [BSX0 + py*SCH/192, YM + SCW/2 - px*SCW/256, ZD + .05];

/* ---------- what the screens show: drawn flat in pixels (256 x 192), then laid on the console ---------- */
const pR = (x, y, w, h, c, extra = '') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${c}" ${extra}/>`;
const pT = (x, y, s, fs, c, wt = 700, an = 'middle', fam = UIF, extra = '') => `<text x="${f(x)}" y="${f(y)}" font-size="${fs}" fill="${c}" font-weight="${wt}" text-anchor="${an}" font-family="${fam}" ${extra}>${esc(s)}</text>`;
const pokeBall = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f7f7f7" stroke="#1b1b1b" style="stroke-width:${f(r*.12)}"/>`
  + `<path d="M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}Z" fill="#e3350d" stroke="#1b1b1b" style="stroke-width:${f(r*.12)}"/>`
  + pR(cx - r, cy - r*.08, 2*r, r*.16, '#1b1b1b') + `<circle cx="${cx}" cy="${cy}" r="${f(r*.3)}" fill="#f7f7f7" stroke="#1b1b1b" style="stroke-width:${f(r*.12)}"/>`;
const diamond = (cx, cy, k) => { const p = pts => pts.map(([x, y]) => f(cx + x*k) + ' ' + f(cy + y*k)).join(' ');
  return `<polygon points="${p([[-16, -6], [-8, -14], [8, -14], [16, -6], [0, 20]])}" fill="#9ad8ff" stroke="#e8f7ff" style="stroke-width:${f(.9*k)}"/>`
    + `<polygon points="${p([[-8, -14], [8, -14], [5, -6], [-5, -6]])}" fill="#e8f7ff"/><polygon points="${p([[-16, -6], [-5, -6], [0, 20]])}" fill="#5fb3f0"/>`
    + `<polygon points="${p([[16, -6], [5, -6], [0, 20]])}" fill="#bfe8ff"/><polygon points="${p([[-5, -6], [5, -6], [0, 20]])}" fill="#7cc6fa"/>`; };
const stars = (seed, n, h) => { let s = '', a = seed; for (let i = 0; i < n; i++){ a = (a*9301 + 49297) % 233280; const x = a/233280*256; a = (a*9301 + 49297) % 233280;
  s += `<circle cx="${f(x)}" cy="${f(a/233280*h)}" r="${i % 4 ? .7 : 1.2}" fill="#ffffff" opacity="${i % 3 ? .55 : .9}"/>`; } return s; };

// health and safety warning
function hsTop(){
  return pR(0, 0, 256, 192, '#ffffff') + `<path d="M30 14L46 42L14 42Z" fill="#f2b31b" stroke="#c98b00" style="stroke-width:1.2" stroke-linejoin="round"/>` + pT(30, 39, '!', 20, '#3a2a00', 900)
    + pT(56, 26, 'AVERTISSEMENT', 15, '#d8342b', 800, 'start') + pT(56, 42, 'SANTÉ ET SÉCURITÉ', 12, '#d8342b', 800, 'start') + pR(14, 54, 228, 1.5, '#d8342b')
    + ['AVANT DE JOUER, LISEZ LE LIVRET', 'SANTÉ ET SÉCURITÉ : IL CONTIENT', 'DES INFORMATIONS IMPORTANTES', 'POUR VOTRE SANTÉ ET', 'VOTRE SÉCURITÉ.'].map((t, i) => pT(128, 80 + i*17, t, 11.5, '#2a2a2a', 700)).join('')
    + pT(128, 180, 'www.nintendo.fr', 9, '#8a8a8a', 500);
}
const hsBot = () => pR(0, 0, 256, 192, '#ffffff') + `<g class="cf-blink">${pT(128, 92, "Touchez l'écran tactile", 15, '#2a2a2a', 700)}${pT(128, 114, 'pour continuer.', 15, '#2a2a2a', 700)}</g>`;
// the DS menu: clock and calendar on top, the programs below
function menuTop(){
  let s = pR(0, 0, 256, 192, '#f2f4f6') + pR(0, 0, 256, 17, '#3d7be0') + pT(8, 12.5, 'Sacha', 10, '#ffffff', 700, 'start') + pT(214, 12.5, '28/10   10:24', 10, '#ffffff', 600, 'end')
    + `<rect x="222" y="5" width="20" height="8" rx="1.5" fill="none" stroke="#ffffff" style="stroke-width:1.2"/>` + pR(242.5, 7.4, 1.6, 3.4, '#ffffff') + pR(224, 6.8, 13, 4.4, '#7fe08a');
  // an analog clock at 10:24
  s += `<circle cx="64" cy="104" r="46" fill="#ffffff" stroke="#b8c2cc" style="stroke-width:2"/>`;
  for (let i = 0; i < 12; i++){ const a = i*Math.PI/6; s += `<line x1="${f(64 + 40*Math.sin(a))}" y1="${f(104 - 40*Math.cos(a))}" x2="${f(64 + 44*Math.sin(a))}" y2="${f(104 - 44*Math.cos(a))}" stroke="#55606b" style="stroke-width:${i % 3 ? 1.2 : 2.4}"/>`; }
  const hand = (deg, len, w, c) => { const a = deg*Math.PI/180; return `<line x1="64" y1="104" x2="${f(64 + len*Math.sin(a))}" y2="${f(104 - len*Math.cos(a))}" stroke="${c}" style="stroke-width:${w}" stroke-linecap="round"/>`; };
  s += hand(312, 24, 3.6, '#2c333a') + hand(144, 36, 2.4, '#2c333a') + `<circle cx="64" cy="104" r="3" fill="#3d7be0"/>`;
  // October 2026: the 1st is a Thursday, today is Wednesday the 28th
  s += `<rect x="124" y="28" width="124" height="152" rx="5" fill="#ffffff" stroke="#b8c2cc" style="stroke-width:1.5"/>` + pT(186, 44, 'Octobre 2026', 11, '#2c333a', 700);
  'LMMJVSD'.split('').forEach((d, i) => s += pT(136 + i*16.6, 60, d, 9, i > 4 ? '#d8342b' : '#55606b', 700));
  for (let d = 1; d <= 31; d++){ const k = d + 2, c = k % 7, r = Math.floor(k/7), x = 136 + c*16.6, y = 80 + r*19;
    if (d === 28) s += `<rect x="${f(x - 8)}" y="${f(y - 12)}" width="16" height="16" rx="3" fill="#3d7be0"/>`;
    s += pT(x, y, String(d), 9.5, d === 28 ? '#ffffff' : c > 4 ? '#d8342b' : '#2c333a', d === 28 ? 800 : 500); }
  return s;
}
function menuBot(st, hi){
  let s = pR(0, 0, 256, 192, '#e8ebee');
  for (let i = 1; i < 16; i++) s += pR(i*16, 0, .6, 192, '#dde1e6') + (i < 12 ? pR(0, i*16, 256, .6, '#dde1e6') : '');
  const has = st.cartP >= 1, panel = (x, y, w, h, fillc, stroke) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fillc}" stroke="${stroke}" style="stroke-width:2"/>`;
  s += panel(14, 12, 228, 60, hi ? '#bcd7ff' : '#ffffff', has ? '#3d7be0' : '#b9c0c8');
  s += has ? `<rect x="24" y="22" width="40" height="40" rx="4" fill="#0d1a46"/>` + pokeBall(44, 42, 14) + pT(74, 35, 'Pokémon', 15, '#1d2430', 800, 'start')
      + pT(74, 52, 'Version Diamant', 11, '#3c4654', 600, 'start') + pT(74, 65, 'Nintendo', 8.5, '#7b8590', 500, 'start')
    : pT(128, 46, 'Aucune carte DS insérée.', 12, '#7b8590', 600);
  s += panel(14, 80, 110, 34, '#ffffff', '#b9c0c8') + `<rect x="24" y="88" width="20" height="18" rx="3" fill="#f2a33a"/>` + pT(52, 101, 'PictoChat', 10, '#1d2430', 700, 'start');
  s += panel(132, 80, 110, 34, '#ffffff', '#b9c0c8') + `<rect x="140" y="88" width="20" height="18" rx="3" fill="#53b45a"/>` + pT(166, 97, 'Téléchargement', 8.5, '#1d2430', 700, 'start') + pT(166, 107, 'DS', 8.5, '#1d2430', 700, 'start');
  s += panel(14, 122, 228, 34, '#f4f5f7', '#c9ced5') + pT(128, 143, 'Aucune cartouche Game Boy Advance', 10, '#9aa2ab', 600);
  s += pR(0, 166, 256, 26, '#d5dbe2') + [[18, '#7b8590'], [46, '#7b8590'], [222, '#f2b31b']].map(([x, c]) => `<circle cx="${x}" cy="179" r="8" fill="${c}"/>`).join('')
    + pT(18, 182.5, 'i', 10, '#ffffff', 800) + `<path d="M42 176.5L50 176.5M42 181.5L50 181.5" stroke="#ffffff" style="stroke-width:1.6"/>` + `<circle cx="222" cy="179" r="3.5" fill="#fff6c8"/>`;
  return s;
}
// the game: title screen
function titleTop(){
  return `<defs><linearGradient id="ttg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070f33"/><stop offset="1" stop-color="#28489a"/></linearGradient></defs>`
    + pR(0, 0, 256, 192, 'url(#ttg)') + stars(7, 36, 192) + diamond(128, 146, 1.5)
    + pT(128, 80, 'POKÉMON', 40, '#ffcb05', 900, 'middle', BIGF, 'stroke="#1f4aa8" style="stroke-width:5;paint-order:stroke" stroke-linejoin="round"')
    + pT(128, 106, 'VERSION DIAMANT', 13, '#cfe9ff', 800, 'middle', UIF, 'letter-spacing="2"');
}
const titleBot = () => pR(0, 0, 256, 192, '#0d1a46') + stars(3, 16, 192) + pokeBall(128, 76, 30) + `<g class="cf-blink">${pT(128, 152, 'APPUYEZ SUR START', 15, '#ffffff', 800, 'middle', PXF)}</g>`;
// the game: the first town, seen from above (16 x 12 tiles of 16 pixels)
const MAP = ['TTTTTTTTTTTTTTTT', 'TggggggggggggggT', 'TgHHHgggggHHHggT', 'TgHHHgggggHHHggT', 'TggpggggggggpgfT', 'TggpppppppppsggT',
  'TfgggggpggggggfT', 'TggggggpgggggggT', 'TgfggwwwwwwgggfT', 'TggggwwwwwwggggT', 'TggfgggggggggfgT', 'TTTTTTTpTTTTTTTT'];
const walkable = (x, y) => y >= 0 && y < 12 && x >= 0 && x < 16 && 'gpf'.includes(MAP[y][x]);
const HERO = { d: ['..RRRR..', '.RRRRRR.', '.HSSSSH.', '.SKSSKS.', '..SSSS..', '.BBWWBB.', '.SBBBBS.', '..DD.DD.'],
  u: ['..RRRR..', '.RRRRRR.', '.HHHHHH.', '.HHHHHH.', '..HHHH..', '.BBBBBB.', '.SBBBBS.', '..DD.DD.'],
  r: ['..RRRR..', '..RRRRRR', '..HSSSS.', '..HSSKS.', '...SSSS.', '..BBBB..', '..BBSB..', '..DD.DD.'] };
function heroSvg(x, y, dir, step){
  const rows = HERO[dir === 'l' ? 'r' : dir], col = { R: '#e3350d', H: '#2b2b38', S: '#f6c9a0', K: '#1b1b1b', B: '#2d5fb8', W: '#f2f2f2', D: '#3a3a46' };
  let s = `<ellipse cx="${f(x + 8)}" cy="${f(y + 15.5)}" rx="5.5" ry="1.6" fill="#000" opacity=".25"/>`;
  rows.forEach((r, j) => r.split('').forEach((c, i) => { if (c === '.') return; const ii = dir === 'l' ? 7 - i : i;
    const lift = j === 7 && step && ((i < 4) === (step > 0)) ? -1 : 0; s += pR(x + ii*2, y + j*2 + lift, 2.05, 2.05, col[c]); }));
  return s;
}
function townTop(st){
  let s = pR(0, 0, 256, 192, '#7cc66b');
  for (let y = 0; y < 12; y++) for (let x = 0; x < 16; x++){ const c = MAP[y][x], X = x*16, Y = y*16;
    if (c === 'g' && (x + 2*y) % 3 === 0) s += pR(X + 4, Y + 6, 1.4, 3, '#5aa64e') + pR(X + 10, Y + 10, 1.4, 3, '#5aa64e');
    if (c === 'p') s += pR(X, Y, 16, 16, '#e7d39b') + ((x + y) % 2 ? pR(X + 5, Y + 7, 2, 2, '#d3bd7f') : '');
    if (c === 'f') s += [[4, 5, '#ff6f91'], [11, 9, '#ffffff'], [6, 12, '#ffd34d']].map(([a, b, k]) => `<circle cx="${X + a}" cy="${Y + b}" r="1.8" fill="${k}"/>`).join('');
    if (c === 'w') s += pR(X, Y, 16, 16, '#4fa3e3') + ((x + y) % 2 ? pR(X + 3, Y + 6, 7, 1.4, '#b9e2ff') : pR(X + 6, Y + 11, 6, 1.4, '#b9e2ff'));
    if (c === 'T') s += pR(X + 6, Y + 10, 4, 6, '#7a5034') + `<circle cx="${X + 8}" cy="${Y + 7}" r="7.5" fill="#2f7d3b"/><circle cx="${X + 6}" cy="${Y + 5}" r="3" fill="#4f9d58"/>`;
    if (c === 's') s += pR(X + 7, Y + 8, 2, 8, '#7a5034') + pR(X + 2, Y + 3, 12, 7, '#a8743f') + pR(X + 4, Y + 5, 8, 1, '#5d3a1d'); }
  for (const hx of [2, 10]){ const X = hx*16, Y = 32;
    s += pR(X + 2, Y + 14, 44, 18, '#f3ead7') + `<path d="M${X} ${Y + 16}L${X + 6} ${Y}L${X + 42} ${Y}L${X + 48} ${Y + 16}Z" fill="#d9534f"/>`
      + pR(X + 4, Y + 5, 40, 1.4, '#b53c38') + pR(X + 2, Y + 10, 44, 1.4, '#b53c38') + pR(X + 19, Y + 21, 10, 11, '#7a5034') + pR(X + 6, Y + 19, 9, 7, '#9fd3f5') + pR(X + 33, Y + 19, 9, 7, '#9fd3f5'); }
  const k = ease(Math.min(1, st.mv)), hx = st.fx + (st.hx - st.fx)*k, hy = st.fy + (st.hy - st.fy)*k;
  s += heroSvg(hx*16, hy*16 - 2, st.dir, st.mv < 1 ? (st.mv < .5 ? 1 : -1) : 0);
  if (st.pt < 3.4){ const o = Math.min(1, st.pt/.3, (3.4 - st.pt)/.4);
    s += `<g opacity="${f(o)}"><rect x="6" y="6" width="104" height="24" rx="3" fill="#fbf6e6" stroke="#6b5a3a" style="stroke-width:2"/>${pT(58, 22.5, 'BONAUGURE', 13, '#3b3020', 800, 'middle', PXF)}</g>`; }
  return s;
}
const townBot = () => pR(0, 0, 256, 192, '#c23b3b') + pR(0, 0, 256, 6, '#a52f2f') + `<rect x="22" y="24" width="196" height="144" rx="10" fill="#a9c99a" stroke="#7d2222" style="stroke-width:4"/>`
  + pT(120, 122, '10:24', 66, '#2c4a2c', 800, 'middle', PXF) + `<rect x="230" y="62" width="18" height="68" rx="4" fill="#e04b4b" stroke="#7d2222" style="stroke-width:2"/>`;
// which picture is on which screen
function screenPics(st){
  const ph = st.phase, t = st.pt, fade = (a, b, o) => `${a}<g opacity="${f(Math.max(0, Math.min(1, o)))}">${b}</g>`;
  if (ph === 'hs') return [hsTop(), hsBot()];
  if (ph === 'menu') return [fade(hsTop(), menuTop(), t/.35), fade(hsBot(), menuBot(st, false), t/.35)];
  if (ph === 'boot'){ const W = pR(0, 0, 256, 192, '#ffffff'), K = pR(0, 0, 256, 192, '#000000');
    const logo = W + `<rect x="68" y="78" width="120" height="36" rx="18" fill="none" stroke="#9a9ea3" style="stroke-width:3"/>` + pT(128, 103, 'Nintendo', 19, '#9a9ea3', 800);

  fig: '05', turn: 'full', title: 'Nintendo DS',
  size: [DX, DY, 86], palette: 'cobalt',
  state: { lid: 0, lidT: 0, cartP: 0, cartT: 0, pow: false, swT: -1, scr: 0, phase: 'off', pt: 0, goal: 0,
    sty: { pose: POSE.silo(), from: POSE.silo(), prog: [], i: 0, t: 0 }, kd: '', kdT: 0, hx: 7, hy: 7, fx: 7, fy: 7, mv: 1, dir: 'd' },
  scene, ground: st => groundSvg(st), groundKey: st => lidTh(st).toFixed(3),
  stats: st => [
    { label: 'Console', value: !st.pow ? 'Éteinte' : st.lid < .9 ? 'En veille' : { hs: 'Avertissement', menu: 'Menu DS', boot: 'Chargement', title: 'Écran titre', start: 'Écran titre', play: 'En jeu' }[st.phase] },
    { label: 'Cartouche', value: st.cartP <= 0 ? 'Sur sa boîte' : st.cartP >= 1 ? 'Insérée' : 'En chemin' } ],
  buttons: [
    { label: 'Ouvrir la console', onClick: st => toggleLid(st) },
    { label: 'Insérer la cartouche', onClick: st => toggleCart(st) },
    { label: 'Allumer la console', onClick: st => togglePower(st) },
    { label: 'Lancer le jeu', onClick: st => launch(st) },
    { label: 'Appuyer sur START', onClick: st => startBtn(st) } ],
  acts: { cart: st => toggleCart(st), power: st => togglePower(st), stylus: st => launch(st), screen: st => launch(st), start: st => startBtn(st),
    A: st => st.phase === 'title' ? startBtn(st) : (lightKey(st, 'A'), run()), B: st => (lightKey(st, 'B'), run()), X: st => (lightKey(st, 'X'), run()), Y: st => (lightKey(st, 'Y'), run()),
    select: st => (lightKey(st, 'select'), run()), du: st => move(st, 'u'), dd: st => move(st, 'd'), dl: st => move(st, 'l'), dr: st => move(st, 'r') },
  params: (st, q) => {
    if (q.has('lid')){ st.lid = st.lidT = +q.get('lid'); }
    if (q.has('cart')){ st.cartP = +q.get('cart'); st.cartT = st.cartP >= 1 ? 1 : 0; }
    if (q.has('phase')){ st.phase = q.get('phase'); st.pow = st.phase !== 'off'; st.scr = st.pow && st.lid > .9 ? 1 : 0; st.pt = +(q.get('pt') || 5); }
    if (q.has('sty')){ const [n, px, py] = q.get('sty').split(':'); st.sty.pose = POSE[n](px ? ptB(+px, +py) : null); }
  },
});
xrMount(() => ui, () => '');
// the buttons say what they will do now (open or close, insert or take out, switch on or off)
(() => { const r0 = ui.render, st = ui.st;
  ui.render = () => { r0(); const bs = document.querySelectorAll('#btns .act'), set = (b, t) => { if (b && b.textContent !== t) b.textContent = t; };
    set(bs[0], st.lidT ? 'Fermer la console' : 'Ouvrir la console'); set(bs[1], st.cartT ? 'Retirer la cartouche' : 'Insérer la cartouche');
    set(bs[2], st.pow ? 'Éteindre la console' : 'Allumer la console'); };
  ui.render();
  const css = document.createElement('style');
  css.textContent = '@keyframes cfblink{0%,55%{opacity:1}70%,100%{opacity:.15}}.cf-blink{animation:cfblink 1.2s infinite}'
    + '@keyframes cfflow{to{stroke-dashoffset:calc(-1*var(--d))}}.cf-flow{animation:cfflow .6s linear infinite}';
  document.head.appendChild(css);
})();
// tests: ?sim=Ouvrir@0.2,Insérer@2&at=5 presses the buttons at those times (s) in a fast simulation, then draws once;
// ?shot=1 hides the page around the drawing; ?bench=1 times a redraw
(() => { const q = new URLSearchParams(location.search), st = ui.st;
  if (q.has('at')){ const acts = { ouvrir: s => { s.lidT = 1; }, fermer: s => { s.lidT = 0; }, 'insérer': s => { s.cartT = 1; }, retirer: s => { s.cartT = 0; },
      allumer: togglePower, 'éteindre': togglePower, lancer: launch, appuyer: startBtn, haut: s => move(s, 'u'), bas: s => move(s, 'd'), gauche: s => move(s, 'l'), droite: s => move(s, 'r') };
    const ev = (q.get('sim') || '').split(',').filter(Boolean).map(s => { const [w, t] = s.split('@'); return [acts[w.toLowerCase()], +t]; }).sort((a, b) => a[1] - b[1]);
    SIM = true; let t = 0, i = 0; const end = +q.get('at');
    while (t < end){ while (i < ev.length && ev[i][1] <= t) ev[i++][0](st); tick(st, 1/60); t += 1/60; }
    SIM = false; ui.render(); }
  if (q.get('shot') === '1'){ const cs = document.createElement('style');
    cs.textContent = '.actions,#stats,.vset,.zchip,body>header,.controls,.made-with,.lgd,.toast{visibility:hidden!important}'; document.head.appendChild(cs); }
  if (q.get('bench') === '1'){ const t0 = performance.now(); for (let i = 0; i < 5; i++) ui.render(); document.documentElement.dataset.bench = ((performance.now() - t0)/5).toFixed(1); }
})();
/* ---------- la page en français ---------- */
(() => {
  const tr = { 'Hand-drawn wobble': 'Trait tremblé', 'Colour': 'Couleur', 'View': 'Vue', 'Labels': 'Étiquettes' };
  document.querySelectorAll('.ctl label').forEach(l => { if (tr[l.textContent]) l.textContent = tr[l.textContent]; });
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('vreset', 'Vue de face'); set('vspin', 'Faire pivoter'); set('xrb', 'Transparence'); set('lblb', 'Étiquettes');
  const pn = { mustard: 'moutarde', tomato: 'tomate', mint: 'menthe', cobalt: 'cobalt', blush: 'rose' };
  document.querySelectorAll('#pals .sw').forEach(b => { if (pn[b.title]) b.title = pn[b.title]; });
  const mwl = document.querySelector('.made-with a'); if (mwl) mwl.textContent = 'Fait avec Colorfigures';
  if (/\/figures\/[^/]*$/.test(location.pathname)){
    const hd = document.querySelector('body > header'); if (hd) hd.insertAdjacentHTML('beforeend', '<span><a href="../" style="color:inherit">← Toutes les figures</a></span>');
    if (mwl) mwl.insertAdjacentHTML('beforebegin', '<a href="../">← Toutes les figures</a> · '); }
  addEventListener('load', () => setTimeout(() => {
    for (const [c, t] of [['.zm', 'Dézoomer'], ['.zp', 'Taille normale'], ['.zi', 'Zoomer']]){ const e = document.querySelector(c); if (e) e.setAttribute('aria-label', t); } }, 0));
})();
/* ---------- grand écran et plein écran ---------- */
(() => {
  const css = document.createElement('style');
  css.textContent = `@media (min-width:561px){
      :root{--figw:max(760px,min(1800px,calc((100vh - 250px)*1.3333)))}
      body>header,.stage,#fig,.controls,.made-with,.lgd{max-width:var(--figw)!important}
      html.fs{--figw:min(calc(100vw - 32px),calc((100vh - 24px)*1.3333))}
      html.fs body{padding-top:10px;padding-bottom:10px}
      html.fs body>header,html.fs .controls,html.fs .made-with{display:none!important}}
    @media (min-width:1800px) and (min-height:1050px){.actions,#stats,.vset,.zchip{zoom:1.3}}`;
  css.textContent += `
    .zchip .fsb{display:inline-grid;place-items:center}
    .fsb svg{width:12px;height:12px}`;
  document.head.appendChild(css);
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => ui.render(), 150); });
  const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!enter) return;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const toggle = () => isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : enter.call(root);
  const icon = out => `<svg viewBox="0 0 16 16" fill="none" stroke="#231e16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${out
    ? 'M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5' : 'M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5'}"/></svg>`;
  let btn = null;
  const sync = () => { root.classList.toggle('fs', isFs());
    if (btn){ btn.innerHTML = icon(isFs()); btn.title = isFs() ? 'Quitter le plein écran (F)' : 'Plein écran (F)'; btn.setAttribute('aria-label', btn.title); }
    dispatchEvent(new Event('resize')); requestAnimationFrame(() => ui.render()); };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('load', () => setTimeout(() => { const chip = document.querySelector('.zchip'); if (!chip) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fsb'; btn.onclick = toggle; chip.prepend(btn); sync(); }, 0));
  addEventListener('keydown', e => { if (e.key.toLowerCase() !== 'f' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); toggle(); });
})();
