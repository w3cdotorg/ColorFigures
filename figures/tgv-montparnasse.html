  run();
}
function closeDoors(st){
  if (st.phase === 'gone') return ui.flash('Le TGV est parti : faites venir la rame suivante');
  if (!st.voie) return ui.flash("Affichez d'abord la voie pour faire monter les voyageur·euse·s");
  if (st.phase === 'closed' || st.phase === 'departing') return ui.flash('Les portes sont déjà fermées');
  st.boarding = false; st.beep = 1.6; st.phase = 'closed'; st.minute = depMin(st) - 2; st.boarded = Math.max(st.boarded, CAP*.96);
  for (const p of st.people) if (!p.gone && p.board){ p.board = false; p.path = []; }                      // trop tard : on reste à quai
  if (!st.agent) st.agent = newPerson(st, PE + 8, doorY() + 14, { agentP: true, keep: true, shirt: NAVY, pants: NAVY, bag: null, cap: '#c0392b', a: Math.PI });
  st.agent.raise = true; st.whistle = 1.4;
  run();
}
function depart(st){
  if (st.phase === 'gone') return ui.flash('Le TGV est déjà parti : faites venir la rame suivante');
  if (st.phase === 'departing') return;
  if (st.power < 1) return ui.flash('La rame est hors tension : levez le pantographe');
  if (!st.voie) return ui.flash("Affichez d'abord la voie et faites monter les voyageur·euse·s");
  if (st.phase !== 'closed') return ui.flash("Fermez d'abord les portes");
  if (st.beep > 0) return ui.flash('Les portes sont en train de se fermer');
  st.phase = 'departing'; st.depT = 0; run();
}
function nextTrain(st){
  if (st.phase !== 'gone') return ui.flash(st.phase === 'departing' ? 'Le TGV est en train de partir' : 'Le TGV est encore à quai');
  Object.assign(st, { s: 0, v: 0, panto: 0, pantoT: null, power: 0, voie: false, boarding: false, doors: 0, doorsWant: false, boarded: 0, sig: 0, cur: 0, fade: 0,
    phase: 'arriving', train: st.train + 1, agent: null, beep: 0, spark: 0 });
  st.people = st.people.filter(p => !p.agentP);
  st.minute = depMin(st) - 26;
  run();
}

ui = mountFigure({
  fig: '02', turn: 'full', title: 'TGV au départ de Montparnasse',
  size: [W + 46, D, H], center: [(W + 46)/2, D/2], palette: 'cobalt',   // room on the right, so the slab's top clears the numbers
  state: { s: 0, v: 0, dir: 1, panto: 0, pantoT: null, power: 0, voie: false, boarding: false, doors: 0, doorsWant: false, boarded: 0, sig: 0, cur: 0,
    fade: 1, phase: 'idle', train: 0, people: [], agent: null, beep: 0, spark: 0, clock: 0, minute: 13*60 + 36, spawnT: 0, spawned: 0, depT: null },
  scene, ground: () => groundSvg(),
  stats: st => [
    { label: 'Personnes à bord', value: frInt(st.boarded) },
    { label: 'Courant', value: frInt(Math.round(st.cur/10)*10) + ' A', small: true },
    { label: 'Vitesse', value: frInt(st.v*0.36) + ' km/h', small: true } ],
  buttons: [
    { label: 'Lever le pantographe', onClick: st => raisePanto(st) },
    { label: 'Afficher la voie', onClick: st => announce(st) },
    { label: 'Fermer les portes', onClick: st => closeDoors(st) },
    { label: 'Démarrer', onClick: st => depart(st) },
    { label: 'Rame suivante', onClick: st => nextTrain(st) } ],
  acts: { train: st => raisePanto(st) },
  params: (st, q) => {
    for (const k of ['s', 'panto', 'power', 'doors', 'boarded', 'sig', 'cur', 'v']) if (q.has(k)) st[k] = +q.get(k);
    if (q.get('voie') === '1') st.voie = true;
  },
});
// the people already waiting on the platform, looking at the board
for (const [x, y, a] of [[96, 104, -Math.PI/2], [101, 110, -Math.PI*.6], [90, 140, Math.PI*.9]]) newPerson(ui.st, x, y, { a });
ui.render();
xrMount(() => ui, () => '');

// tests: ?sim=Lever@0.3,Afficher@2&at=9 presses the buttons at those times (s) in a fast simulation, then draws once;
// ?bench=1 times a full redraw (<html data-bench="ms">); ?shot=1 hides the page around the drawing
(() => { const q = new URLSearchParams(location.search), st = ui.st;
  if (q.has('at')){ const acts = { lever: raisePanto, afficher: announce, fermer: closeDoors, 'démarrer': depart, demarrer: depart, rame: nextTrain };
    const ev = (q.get('sim') || '').split(',').filter(Boolean).map(s => { const [w, t] = s.split('@'); return [acts[w.toLowerCase()], +t]; }).sort((a, b) => a[1] - b[1]);
    SIM = true; let t = 0, i = 0; const end = +q.get('at');
    while (t < end){ while (i < ev.length && ev[i][1] <= t) ev[i++][0](st); tick(st, 1/60); t += 1/60; }
    SIM = false; ui.render(); }
  if (q.get('shot') === '1'){ const cs = document.createElement('style');
    cs.textContent = '.actions,#stats,.vset,.zchip,body>header,.controls,.made-with,.lgd,.toast{visibility:hidden!important}'; document.head.appendChild(cs); }
  if (q.get('bench') === '1'){ const t0 = performance.now(); for (let i = 0; i < 5; i++) ui.render(); document.documentElement.dataset.bench = ((performance.now() - t0)/5).toFixed(1); }
})();
/* ---------- la page en français ---------- */
(() => {
  const tr = { 'Hand-drawn wobble': 'Trait tremblé', 'Colour': 'Couleur', 'View': 'Vue', 'Labels': 'Étiquettes' };
  document.querySelectorAll('.ctl label').forEach(l => { if (tr[l.textContent]) l.textContent = tr[l.textContent]; });

    if (mwl) mwl.insertAdjacentHTML('beforebegin', '<a href="../">← Toutes les figures</a> · '); }
  addEventListener('load', () => setTimeout(() => {
    for (const [c, t] of [['.zm', 'Dézoomer'], ['.zp', 'Taille normale'], ['.zi', 'Zoomer']]){ const e = document.querySelector(c); if (e) e.setAttribute('aria-label', t); } }, 0));
})();

/* ---------- grand écran et plein écran ----------
   The page is 760 px wide by default: on a large window the figure grows with the window's height (so it never
   needs scrolling), up to 1800 px. A button beside the zoom chip (or the F key) puts the figure in full screen,
   without the title and the settings, and the figure then fills the screen. */
(() => {
  const css = document.createElement('style');
  css.textContent = `@media (min-width:561px){
      :root{--figw:max(760px,min(1800px,calc((100vh - 250px)*1.3333)))}
      body>header,.stage,#fig,.controls,.made-with,.lgd{max-width:var(--figw)!important}
      html.fs{--figw:min(calc(100vw - 32px),calc((100vh - 24px)*1.3333))}
      html.fs body{padding-top:10px;padding-bottom:10px}
      html.fs body>header,html.fs .controls,html.fs .made-with{display:none!important}}
    @media (min-width:1800px) and (min-height:1050px){.actions,#stats,.vset,.zchip{zoom:1.3}}`;
  css.textContent += `
    .zchip .fsb{display:inline-grid;place-items:center}
    .fsb svg{width:12px;height:12px}`;
  document.head.appendChild(css);
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => ui.render(), 150); });   // label columns sit under the buttons
  const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!enter) return;                                                  // iPhone Safari: no full screen for pages
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const toggle = () => isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : enter.call(root);
  const icon = out => `<svg viewBox="0 0 16 16" fill="none" stroke="#231e16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${out
    ? 'M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5' : 'M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5'}"/></svg>`;
  let btn = null;
  const sync = () => { root.classList.toggle('fs', isFs());
    if (btn){ btn.innerHTML = icon(isFs()); btn.title = isFs() ? 'Quitter le plein écran (F)' : 'Plein écran (F)'; btn.setAttribute('aria-label', btn.title); }
    dispatchEvent(new Event('resize')); requestAnimationFrame(() => ui.render()); };   // labels follow the new size
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  addEventListener('load', () => setTimeout(() => { const chip = document.querySelector('.zchip'); if (!chip) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fsb'; btn.onclick = toggle; chip.prepend(btn); sync(); }, 0));
  addEventListener('keydown', e => { if (e.key.toLowerCase() !== 'f' || e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); toggle(); });
})();
