<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGV au départ de Montparnasse</title><style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// byDepth for big scenes (~100 parts and more, every part with a box). Array.sort with a comparator that is not
// transitive (box separation, else centre depth) misplaces parts once there are many, and the order can flip from one
// frame to the next (flicker). Here only pairs that overlap on screen get an order: boxes separated along an axis (every
// separating axis agreeing, else the pair is left unordered), else centre depth. Parts caught in a cycle (Tarjan) are
// drawn together: separated boxes keep their order, the depth guesses give way. Keep moving parts from overlapping a
// very large box (a building, a slab): a cycle through it is what flickers.
function byDepthG(parts){
  const it = parts.filter(Boolean).map(p => { const b = p.box, X = [], Y = [];
    for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]){ const q = P(x, y, z); X.push(q[0]); Y.push(q[1]); }
    return { p, d: depthOf(boxMid(b)), x0: Math.min(...X), x1: Math.max(...X), y0: Math.min(...Y), y1: Math.max(...Y), out: [], hard: [], i: -1, low: 0, on: false }; });
  for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++){ const a = it[i], b = it[j];
    if (a.x1 <= b.x0 || b.x1 <= a.x0 || a.y1 <= b.y0 || b.y1 <= a.y0) continue;
    let s = 0, clash = false;
    for (let k = 0; k < 3; k++){ if (Math.abs(CAM_V[k]) < 1e-3) continue; const A = a.p.box, B = b.p.box, v = A[1][k] <= B[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? -1 : 1) : B[1][k] <= A[0][k] + 1e-6 ? (CAM_V[k] >= 0 ? 1 : -1) : 0;
      if (v && s && v !== s) clash = true; if (v) s = v; }
    if (clash) continue;
    const hard = !!s; if (!s) s = a.d <= b.d ? -1 : 1;
    const [u, v] = s < 0 ? [a, b] : [b, a]; u.out.push(v); if (hard) u.hard.push(v); }
  let n = 0; const stk = [], comps = [];
  const visit = v => { v.i = v.low = n++; stk.push(v); v.on = true;
    for (const w of v.out){ if (w.i < 0){ visit(w); v.low = Math.min(v.low, w.low); } else if (w.on) v.low = Math.min(v.low, w.i); }
    if (v.low === v.i){ const c = []; let w; do { w = stk.pop(); w.on = false; c.push(w); } while (w !== v); comps.push(c); } };
  for (const v of it.slice().sort((a, b) => a.d - b.d)) if (v.i < 0) visit(v);
  const inside = c => { if (c.length < 2) return c; const set = new Set(c), indeg = new Map(c.map(v => [v, 0]));
    for (const v of c) for (const w of v.hard) if (set.has(w)) indeg.set(w, indeg.get(w) + 1);
    const left = new Set(c), out = [];
    while (left.size){ let pick = null;
      for (const v of left) if (!indeg.get(v) && (!pick || v.d < pick.d)) pick = v;
      if (!pick) for (const v of left) if (!pick || v.d < pick.d) pick = v;
      left.delete(pick); out.push(pick); for (const w of pick.hard) if (left.has(w)) indeg.set(w, indeg.get(w) - 1); }
    return out; };
  return comps.reverse().map(c => inside(c).map(v => v.p.svg).join('')).join('');
}
// labels are only built while they are shown (the Labels switch redraws): a figure's own label code can check this too
const labelsShown = () => !document.documentElement.classList.contains('nolabels');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.

    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };
  // One frame driver for every running animation: each frame runs all the steps, then draws once (two animations at
  // the same time no longer draw twice). It follows the screen's frames, with a timer fallback for when frames don't
  // come (headless shots, a hidden tab). ui.invalidate() asks for one redraw on the next frame (used while dragging).
  const steps = new Set(); let driving = false, lastT = 0, fbT = 0;
  const frame = () => { if (!driving) return; driving = false; clearTimeout(fbT);
    const now = performance.now(), dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = now;
    for (const s of [...steps]) if (s(dt) === false) steps.delete(s);
    ui.render(); if (steps.size) drive(); };
  const drive = () => { if (driving) return; driving = true; requestAnimationFrame(frame); fbT = setTimeout(frame, 60); };
  ui.animate = step => { if (!steps.size && !driving) lastT = performance.now(); moving++; clearTimeout(calmT); flat(true); let done = false;
    steps.add(dt => { const r = step(dt); if (r === false && !done){ done = true; moving = Math.max(0, moving - 1); if (!moving) calm(); } return r; }); drive(); };
  ui.invalidate = () => drive();

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  // orbit: drag anywhere that is not a clickable part (the machine turns the way the finger moves); arrow keys nudge; double-click eases back to the front view
  let drag = null, spin = false, camAnim = 0;
  const camTo = (y, p, ms=700) => { const y0 = YAW, p0 = PITCH, dy = ((y - y0 + 540) % 360) - 180, id = ++camAnim; let t = 0;
    ui.animate(dt => { if (id !== camAnim) return false; t += dt*1000; const k = Math.min(1, t / ms), e = ease(k); setCam(y0 + dy*e, p0 + (p - p0)*e); return k < 1; }); };
  ui.camTo = camTo;
  svg.addEventListener('pointerdown', () => { clearTimeout(calmT); flat(true); });
  addEventListener('pointerup', () => { if (!moving) calm(); });
  svg.addEventListener('pointerdown', e => { if (e.button || e.target.closest('[data-act]')) return;
    camAnim++; drag = { x:e.clientX, y:e.clientY, yaw:YAW, pitch:PITCH }; svg.classList.add("drag"); try { svg.setPointerCapture(e.pointerId); } catch {} });
  svg.addEventListener('pointermove', e => { if (!drag) return; const k = 300 / svg.getBoundingClientRect().width;
    setCam(drag.yaw + (e.clientX - drag.x)*.55*k, drag.pitch + (e.clientY - drag.y)*.35*k); ui.invalidate(); });
  const endDrag = () => { drag = null; svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('dblclick', e => { if (!e.target.closest('[data-act]')) camTo(YAW0, PITCH0); });
  addEventListener('keydown', e => { const k = { ArrowLeft:[-15,0], ArrowRight:[15,0], ArrowUp:[0,8], ArrowDown:[0,-8] }[e.key];
    if (!k || window.GAME_KEYS || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); camTo(YAW + k[0], PITCH + k[1], 260); });   // a game figure keeps the arrows for play
  document.getElementById('vreset').onclick = () => { spin = false; vsp.setAttribute('aria-pressed', false); camTo(YAW0, PITCH0); };
  const vsp = document.getElementById('vspin');
  vsp.onclick = () => { spin = !spin; vsp.setAttribute('aria-pressed', spin); camAnim++;
    let dir = 1;   // with a turning limit, the turntable swings back and forth inside it
    if (spin) ui.animate(dt => { if (!spin) return false; if (!drag){ let y = YAW + dir*dt*18;
      if (CAM_LIM != null && Math.abs(y - YAW0) >= CAM_LIM - .5){ dir = -dir; y = YAW + dir*dt*18; } setCam(y, PITCH); } return true; }); };
  if (q.has('yaw') || q.has('pitch')) setCam(+(q.get('yaw') ?? YAW0), +(q.get('pitch') ?? PITCH0));
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => { setLabels(document.documentElement.classList.contains('nolabels')); ui.render(); };
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  if (!labelsShown()) return '';
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); getUI().render(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>
/* Un TGV Duplex au départ de Paris-Montparnasse, voie 3, à la sortie de la dalle du Jardin Atlantique.
   Comment ça marche vraiment (où sont le courant et les voyageur·euse·s après chaque étape) :
   1. Lever le pantographe : la rame est à quai, hors tension. Le conducteur lève le pantographe de la motrice, qui
      vient frotter sous les fils de contact ; le disjoncteur se ferme. Le courant continu 1 500 V part de la
      sous-station, monte par le feeder jusqu'à la caténaire (câble porteur + deux fils de contact), descend par le
      pantographe dans la motrice et revient à la sous-station par les roues et les rails. À l'arrêt, il n'alimente
      que les auxiliaires : éclairage, ventilation, portes.
   2. Afficher la voie : environ 20 minutes avant le départ, le tableau affiche la voie ; les voyageur·euse·s sortent
      du hall, sous la dalle, longent le quai jusqu'à leur voiture et montent par la porte (rame sous tension).
   3. Fermer les portes : deux minutes avant le départ, un signal sonore retentit et les portes se ferment et se
      verrouillent ; qui arrive après reste sur le quai.
   4. Donner le départ : l'agent d'escale donne le départ, le signal s'ouvre (carré rouge -> voie libre verte) et le
      conducteur pousse le manipulateur : les onduleurs alimentent les moteurs de traction, le courant monte à
      quelques milliers d'ampères, la rame s'ébranle et quitte la gare.
   5. Rame suivante : la rame suivante est mise à quai, hors tension, pour le train suivant.
   Pièces (chacune tenue par une autre) :
   VOIE        ballast . traverses . selles . rails (écartement 1 435 mm) . câble de retour vers la sous-station
   GARE        dalle du Jardin Atlantique (poutre, voiles, ouverture sombre vers le hall, gazon, arbres, garde-corps) .
               quai (bord, bande d'éveil de vigilance, rampe) . tableau des départs . horloge . nom de gare .
               candélabres . banc . corbeille . sous-station (bâtiment, transformateur, redresseur, isolateurs)
   CATÉNAIRE   deux poteaux et leurs massifs . consoles et haubans . isolateurs . câble porteur . deux fils de
               contact . pendules . bras de rappel . feeder . signal (mât, cible, feux)
   MOTRICE     caisse et nez . pare-brise . phares . chasse-obstacles . jupes . deux bogies moteurs (roues, châssis)
               . pantographe (isolateurs, bras inférieur et supérieur, archet, bandes de frottement) . disjoncteur .
               ligne de toiture . grilles de ventilation . porte de cabine . conducteur
   DEDANS      cabine (pupitre, manipulateur, siège) . disjoncteur . filtre (self) . transformateur . deux blocs
               onduleurs . quatre moteurs de traction et leurs cardans . ventilateurs . batterie
   VOITURE     caisse Duplex . soufflet . bogies . portes . fenêtres des deux salles ; dedans : planchers, escalier,
               sièges des salles haute et basse, voyageur·euse·s assis·es */

/* ---------- géométrie (x = profondeur, y = le long de la voie, z = haut ; 1 unité = 10 cm) ---------- */
const W = 124, D = 400, H = 212;
const TX = 50, HG = 7.18, BAL = 2.4, TIE = 4, RT = 5.6;              // axe de la voie, demi-écartement, ballast, traverses, rail
const SLABY = 50, SLZ = RT + 180, OPX = [29, 117], OPZ = 86;          // dalle (18 m au-dessus des rails) : face avant, dessus ; ouverture
const PE = TX + 16.5, PX1 = 118, QZ = RT + 5.5, PEND = 330;           // quai : bord, fond, dessus (55 cm), fin
const NY0 = 340;                                                      // nez de la motrice, rame à quai
const MOT = 221.5, GAP = 3, CAR = 187, CAR1 = 218.5;                   // motrice, intervalle, remorque, remorque d'extrémité
const BW = 14.5, MBW = 14.07, ROOF = RT + 41, CROOF = RT + 43;        // demi-largeurs (remorque, motrice), toits
const RW = 4.6, AZ = RT + RW, WX0 = 6.4, WX1 = 7.9;                   // roues (92 cm)
const CWZ = RT + 55, MSZ = 72, MX = TX - 24, MASTS = [110, 290];      // fils de contact, porteur, poteaux
const SIGY = 352, BOARDY = 92, CLOCKY = 196;
const PANTO = 178, PANTO_AC = 116, DJ = 150;                           // pantographes 1,5 kV et 25 kV, disjoncteur (u depuis le nez)
const DOOR = [36, 45];                                                // la porte de chaque voiture, à l'avant de la salle basse
const CAP = 556;                                                      // places d'une rame Océane

const BODY = { l:'#f6f7f6', m:'#d7dbde', d:'#a5adb4' }, IRON = { l:'#8a97a2', m:'#66737e', d:'#414c55' };
const SOOT = { l:'#625d59', m:'#47423e', d:'#2b2724' }, STEEL = { l:'#e3e7e9', m:'#b3babe', d:'#7d868b' };
const TYRE = { l:'#9aa0a4', m:'#73797d', d:'#4b5054' }, CONC = { l:'#e2ddd2', m:'#c6c0b2', d:'#99927f' };
const PLAT = { l:'#d9d5cc', m:'#bdb8ad', d:'#918b7e' }, BRICK = { l:'#d08b6a', m:'#b06e50', d:'#7a4733' };
const GRASS = { l:'#a6cf86', m:'#86b066', d:'#567a3d' }, LEAF = { l:'#7fbf6a', m:'#5e9e4c', d:'#3a6b2e' };
const BARK = { l:'#9c6c43', m:'#7b5230', d:'#4d331d' }, CU = { l:'#f2b27a', m:'#d48a4f', d:'#975a2c' };
const BALLAST = { l:'#d2cabb', m:'#b2aa99', d:'#867e70' }, SLEEPER = { l:'#c9c3b6', m:'#a9a395', d:'#7d776a' };
const RAILM = { l:'#c7ccce', m:'#959b9f', d:'#62686c' }, NAVY = { l:'#3b4f78', m:'#2a3a5c', d:'#1a2540' };
const PORC = { l:'#a8603a', m:'#8a4a2a', d:'#5c2f1a' }, WATERM = { l:'#9fd2f0', m:'#5aa9da', d:'#2f78ad' };
const SEAT = { l:'#6f8fc9', m:'#55729f', d:'#36496b' }, GLASSD = '#2b3640', LIT = '#ffe7a3', AMP = '#ffd23a';
const SKIN = ['#f1c7a5', '#c8946b', '#8d5a3c', '#e8b48f', '#a7714f'], HAIR = ['#3a2a1e', '#1f1a17', '#8a5a2e', '#d9b46a', '#5a4636'];
const CLOTH = ['#e2483d', '#3e86d9', '#f2c230', '#38a565', '#8c4bd1', '#f08a2b', '#4b5563', '#d94f86'];

/* ---------- petits outils ---------- */
let SS = 0;                                                           // avance de la rame (st.s) pour le dessin en cours
const TY = u => NY0 + SS - u;                                         // y d'un point de la rame à u (depuis le nez)
const Tp = (dx, u, z) => [TX + dx, TY(u), z];
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const rbox = (a, b, r, r1 = r) => { const d = norm(sub(b, a)), R = Math.max(r, r1), e = d.map(v => R*Math.sqrt(Math.max(0, 1 - v*v)));
  return [[0,1,2].map(i => Math.min(a[i], b[i]) - e[i]), [0,1,2].map(i => Math.max(a[i], b[i]) + e[i])]; };
const bboxOf = (pts, e = 0) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const xs = (sg, a, b) => { const p = TX + sg*a, q = TX + sg*b; return [Math.min(p, q), Math.max(p, q)]; };
const mw = w => `style="stroke-width:${f(w)}"`;
const strk = (pts, col, w, cap = 'round', extra = '') => `<path d="${pd(pts, false)}" fill="none" stroke="${col}" ${mw(w)} stroke-linecap="${cap}" stroke-linejoin="round" ${extra}/>`;
const cable = (pts, col, w) => strk(pts, INK, w + .4) + strk(pts, col, w);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fr1 = v => v.toFixed(1).replace('.', ',');
const frInt = v => Math.round(v).toLocaleString('fr-FR');
const hhmm = m => { const t = Math.round(m) % 1440; return String(Math.floor(t/60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
function kit(){ const parts = [];
  const put = (b, svg) => { if (svg) parts.push({ box: b, svg }); };
  return { parts, put,
    bx: (x0, y0, z0, x1, y1, z1, M, sh = tone, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, sh, w)),
    rd: (a, b, r, M, sh = tone, w = .8, r1 = r, n = 8) => put(rbox(a, b, r, r1), rod(a, b, r, M, sh, w, r1, n)) }; }
// a thin line (wire, rope, cable) cut into short pieces, each with its own box, so it sorts with the solids it passes
function lineParts(K, pts, col, w, L = 12, edge = true){
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / L));
    for (let j = 0; j < n; j++){ const p = lerp3(a, b, j/n), q = lerp3(a, b, (j + 1)/n); K.put(rbox(p, q, Math.max(.15, w/2)), edge ? cable([p, q], col, w) : strk([p, q], col, w)); } } }
// a turned part round a vertical axis at (x, y), from a profile [[z, r], ...] bottom to top
function lathe(x, y, prof, M, w = 1.1, n = 14, sh = tone){
  const R = prof.map(([z, r]) => on(PZ(z), ellUV(x, y, Math.max(r, .05), Math.max(r, .05), n))); let s = '';
  for (let i = 0; i < R.length - 1; i++) s += loft(R[i], R[i + 1], nr => sh(nr, M));
  s += fill(pd(R[R.length - 1]), sh([0,0,1], M));
  return s + hullInk(R.flat(), w);
}
// a box turned by angle a round the vertical (a suitcase, a bench), centred (cx, cy), half-length hl along a, half-width hw
function obox(cx, cy, z0, z1, hl, hw, a, M, w = .7){
  const c = Math.cos(a), s = Math.sin(a), q = [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw]].map(([l, k]) => [cx + c*l - s*k, cy + s*l + c*k]);
  const B = q.map(([x, y]) => [x, y, z0]), T = q.map(([x, y]) => [x, y, z1]); let out = '';
  for (let i = 0; i < 4; i++){ const j = (i + 1) % 4, n = norm([(q[i][0] + q[j][0])/2 - cx, (q[i][1] + q[j][1])/2 - cy, 0]);
    if (vis(n)) out += shape([B[i], B[j], T[j], T[i]], tone(n, M), w*.6); }
  if (vis([0,0,1])) out += shape(T, tone([0,0,1], M), w*.6);
  return out + hullInk([...B, ...T], w);
}
// a box seen from inside: far walls, the contents, then the near walls see-through
function hollowBox(x0, y0, z0, x1, y1, z1, M, contents, farOp = 1, nearOp = .3, w = .7){
  const F = [[[0,1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1], [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]], [[0,0,-1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  const far = F.filter(([n]) => !vis(n)).map(([n, q]) => fill(pd(q), toneI(n.map(v => -v), M)) + ink(pd(q), w*.6)).join('');
  const near = F.filter(([n]) => vis(n)).map(([n, q]) => fill(pd(q), tone(n, M)) + ink(pd(q), w)).join('');
  return `<g opacity="${farOp}">${far}</g>${contents}<g opacity="${nearOp}">${near}</g>`;
}
// a plate wheel on an axle along x (TGV wheels are solid discs): tyre band, face with its hub toward the viewer
function wheelX(xa, xb, y, z, r, M, ang){
  const A = on(PX(xa), ellUV(y, z, r, r, 18)), B = on(PX(xb), ellUV(y, z, r, r, 18));
  let s = loft(A, B, n => tone(n, TYRE));
  const fx = facing([1,0,0]) ? xb + .02 : facing([-1,0,0]) ? xa - .02 : null;
  if (fx != null){ const nx = fx > xb ? 1 : -1, rg = (rr, dy = 0, dz = 0) => on(PX(fx), ellUV(y + dy, z + dz, rr, rr, 16));
    s += `<path d="${pd(rg(r))}${pd(rg(r*.86).reverse())}" fill="${tone([nx,0,0], TYRE)}" fill-rule="evenodd"/>` + shape(rg(r*.86), tone([nx,0,0], M), .6)
      + shape(rg(r*.3), tone([nx,0,0], STEEL), .6) + ink(pd(rg(r)), .8);
    for (let i = 0; i < 4; i++){ const a = ang + i*Math.PI/2; s += fill(pd(rg(r*.07, r*.55*Math.cos(a), r*.55*Math.sin(a))), INK); } }
  return s + hullInk([...A, ...B], 1.2);
}
// a small disc facing direction n (a lamp, a gauge), as a point list
const discN = (c, n, r, k = 14) => { const u = norm(cross(n, Math.abs(n[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(norm(n), u);
  return Array.from({length:k}, (_, i) => { const t = i/k*2*Math.PI; return [0,1,2].map(j => c[j] + u[j]*Math.cos(t)*r + v[j]*Math.sin(t)*r); }); };
const txSide = (x, y, z, str, size, col, sg, fam = 'ui-monospace,Menlo,monospace', wt = 800) => `<text transform="${txM(P(x, y, z), Dv(0, -sg, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${fam}" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;
const txEnd = (x, y, z, str, size, col, sg, anchor = 'middle', wt = 800) => `<text transform="${txM(P(x, y, z), Dv(sg, 0, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".03em">${str}</text>`;

/* ---------- la voie ---------- */
function trackBed(){
  const pr = [[TX - 15, 0], [TX + 15, 0], [TX + 12.8, BAL], [TX - 12.8, BAL]], A = on(PY(SLABY), pr), B = on(PY(D), pr);
  let s = loft(A, B, n => tone(n, BALLAST));
  if (facing([0,1,0])) s += shape(B, tone([0,1,0], BALLAST), .8);
  const top = [[TX - 12.8, SLABY, BAL + .02], [TX + 12.8, SLABY, BAL + .02], [TX + 12.8, D, BAL + .02], [TX - 12.8, D, BAL + .02]];
  s += `<defs><pattern id="tgGrav" patternUnits="userSpaceOnUse" width="5.3" height="4.1"><path d="M.6 .9l.9-.5.5.8zM3.1 2.2l.8-.4.4.9zM1.4 3.3l.7-.2.2.6zM4.4 .6l.5.1-.3.5z" fill="${BALLAST.d}" opacity=".6"/></pattern></defs>`
    + fill(pd(top), 'url(#tgGrav)') + hullInk([...A, ...B], 1.6);
  const sl = [];
  for (let y = SLABY + 3; y < D - 1; y += 6){
    let t = box(TX - 12.5, y - 1.3, BAL, TX + 12.5, y + 1.3, TIE, SLEEPER, tone, .6);                       // traverses béton
    for (const sg of [-1, 1]) t += fill(pd([[TX + sg*HG - 1.1, y - .9, TIE + .02], [TX + sg*HG + 1.1, y - .9, TIE + .02], [TX + sg*HG + 1.1, y + .9, TIE + .02], [TX + sg*HG - 1.1, y + .9, TIE + .02]]), '#4a4642');
    sl.push({ box: [[TX - 12.5, y - 1.3, BAL], [TX + 12.5, y + 1.3, TIE]], svg: t }); }
  return s + byDepth(sl);
}
function railsSvg(){
  return byDepth([-1, 1].map(sg => { const xc = TX + sg*HG;
    return { box: [[xc - .65, SLABY, TIE], [xc + .65, D, RT]], svg: box(xc - .65, SLABY, TIE, xc + .65, D, TIE + .3, RAILM, tone, .5)
      + box(xc - .18, SLABY, TIE + .3, xc + .18, D, RT - .6, RAILM, tone, .4) + box(xc - .36, SLABY, RT - .6, xc + .36, D, RT, RAILM, tone, .8) }; }));
}
// the far end of the track fades into the paper, so a train can leave the picture
function fadeDefs(){
  let a = P(TX, D - 46, 22), b = P(TX, D - 4, 22); const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (L < 8){ const k = 8/(L || 1); b = [a[0] + (b[0] - a[0])*k || a[0], a[1] + (b[1] - a[1])*k || a[1] + 8]; }
  return `<defs><linearGradient id="tgFadeG" gradientUnits="userSpaceOnUse" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>`
    + `<mask id="tgFade" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="8000" height="8000"><rect x="-4000" y="-4000" width="8000" height="8000" fill="url(#tgFadeG)"/></mask></defs>`;
}

/* ---------- la dalle du Jardin Atlantique ---------- */
function slabParts(K){
  const { put, rd } = K, x0 = OPX[0], x1 = OPX[1];
  let s = box(0, 0, 0, W, SLABY, SLZ, CONC, tone, 1.6);
  if (facing([0,1,0])){ const y = SLABY + .05, fy = [0, 1, 0];
    // the dark way into the hall, under the slab: the track and the platform go in
    s += shape([[x0, y, 0], [PE, y, 0], [PE, y, QZ], [x1, y, QZ], [x1, y, OPZ], [x0, y, OPZ]], '#25211d', 1.2);
    s += fill(pd([[x0 + 1, y + .01, OPZ - 1], [x1 - 1, y + .01, OPZ - 1], [x1 - 1, y + .01, OPZ - 6], [x0 + 1, y + .01, OPZ - 6]]), '#3a352f');
    let ln = ''; for (let z = OPZ + 6; z < SLZ - 2; z += 24) ln += pd([[0, y, z], [W, y, z]], false);
    for (let x = 6; x < W; x += 16) ln += x < x0 || x > x1 ? pd([[x, y, 0], [x, y, SLZ - 4]], false) : pd([[x, y, OPZ], [x, y, SLZ - 4]], false);
    s += `<path d="${ln}" fill="none" stroke="${CONC.d}" ${mw(.3)}/>`;
    for (let z = OPZ + 10; z < SLZ - 12; z += 24) for (let x = 8; x < W - 8; x += 16) s += fill(pd([[x + 1.5, y + .02, z], [x + 13.5, y + .02, z], [x + 13.5, y + .02, z + 7], [x + 1.5, y + .02, z + 7]]), '#4a4640', 'opacity=".75"');
    // track number over the track
    s += shape([[TX - 3, y + .1, OPZ - 7.5], [TX + 3, y + .1, OPZ - 7.5], [TX + 3, y + .1, OPZ - 1.5], [TX - 3, y + .1, OPZ - 1.5]], NAVY.m, .6)
      + `<text transform="${txM(P(TX, y + .15, OPZ - 6.3), Dv(1, 0, 0), Dv(0, 0, -1))}" font-size="4.6" fill="#ffffff" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">3</text>`; }
  // grass on top, a path
  if (facing([0,0,1])) s += fill(pd([[1.5, 1.5, SLZ + .05], [W - 1.5, 1.5, SLZ + .05], [W - 1.5, SLABY - 3, SLZ + .05], [1.5, SLABY - 3, SLZ + .05]]), GRASS.m)
    + fill(pd([[1.5, 20, SLZ + .1], [W - 1.5, 26, SLZ + .1], [W - 1.5, 32, SLZ + .1], [1.5, 26, SLZ + .1]]), '#e8dfc8');
  put([[0, 0, 0], [W, SLABY, SLZ]], s);
  // railing along the edge, trees, a bench
  { let r = rod([1, SLABY - 1.2, SLZ + 9], [W - 1, SLABY - 1.2, SLZ + 9], .25, STEEL, tone, .6, .25, 6);
    for (let x = 2; x < W; x += 8) r += rod([x, SLABY - 1.2, SLZ], [x, SLABY - 1.2, SLZ + 9], .18, STEEL, tone, .4, .18, 5);
    put([[0, SLABY - 1.5, SLZ], [W, SLABY - .9, SLZ + 9.3]], r); }
  for (const [x, y, h, r] of [[18, 12, 15, 7], [62, 36, 13, 6], [96, 14, 16, 7.5]]){
    rd([x, y, SLZ], [x, y, SLZ + h], .8, BARK, tone, .8, .6, 8);
    put([[x - r, y - r, SLZ + h - r*.5], [x + r, y + r, SLZ + h + r*1.3]], lathe(x, y, [[SLZ + h - r*.45, .2], [SLZ + h - r*.2, r*.7], [SLZ + h + r*.25, r], [SLZ + h + r*.8, r*.85], [SLZ + h + r*1.2, r*.45], [SLZ + h + r*1.3, .1]], LEAF, 1.4, 18)); }
  put([[78, 24, SLZ], [88, 27, SLZ + 4]], box(78, 24, SLZ + 2, 88, 27, SLZ + 2.6, BARK, tone, .6) + box(79, 24.5, SLZ, 80, 26.5, SLZ + 2, SOOT, tone, .4) + box(86, 24.5, SLZ, 87, 26.5, SLZ + 2, SOOT, tone, .4));
}

/* ---------- la sous-station et le feeder ---------- */
function substationParts(st, K){
  const { put, bx, rd } = K;
  let s = box(3, 64, 0, 21, 100, 24, BRICK, tone, 1.4) + box(2.4, 63.4, 24, 21.6, 100.6, 25.4, CONC, tone, 1);
  if (facing([1,0,0])){ const x = 21.05;
    s += shape([[x, 70, 0], [x, 76, 0], [x, 76, 14], [x, 70, 14]], SOOT.m, .8)
      + shape([[x, 82, 16], [x, 96, 16], [x, 96, 20.5], [x, 82, 20.5]], '#f4d03f', .7)
      + `<text transform="${txM(P(x + .05, 89, 17.4), Dv(0, -1, 0), Dv(0, 0, -1))}" font-size="2.1" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">SOUS-STATION 1 500 V</text>`;
    let gr = ''; for (let z = 4; z <= 11; z += 1.4) gr += pd([[x, 84, z], [x, 94, z]], false); s += `<path d="${gr}" fill="none" stroke="${INK}" ${mw(.25)}/>`; }
  put([[2.4, 63.4, 0], [21.6, 100.6, 25.4]], s);
  // transformer outside with its fins and bushings
  bx(4, 104, 0, 14, 116, 1.2, CONC, tone, .7);
  put([[4.5, 104.5, 1.2], [13.5, 115.5, 14]], box(5.5, 105.5, 1.2, 12.5, 114.5, 11, IRON, tone, 1.1)
    + [107, 109.5, 112].map(y => box(12.5, y - .5, 2.5, 14, y + .5, 10, IRON, tone, .4)).join('')

  // feeder: from the substation roof, on an insulator, up to the first mast and along to the messenger

/* ---------- la caténaire, le signal ---------- */
const stagger = y => 2*Math.cos(Math.PI*(y - MASTS[0])/(MASTS[1] - MASTS[0]));
const msgZ = y => MSZ - 1.4*Math.pow(Math.sin(Math.PI*(y - MASTS[0])/(MASTS[1] - MASTS[0])), 2);
function catenaryParts(st, K){
  const { put, bx, rd } = K;

    bx(MX - 2, m - 2, 0, MX + 2, m + 2, 1.4, CONC, tone, .7);

    rd([MX + 1.2, m, 74.6], [TX + 6, m, 74.6], .35, STEEL, tone, .6, .35, 8);                                  // console
    rd([MX + 1.2, m, 79], [TX - 4, m, 74.9], .3, STEEL, tone, .5, .3, 8);                                    // hauban
    for (const [p, q] of [[[MX + 2.2, m, 74.6], [MX + 5.2, m, 74.6]], [[MX + 2.4, m, 78.4], [MX + 5.2, m, 77.6]]]){ let ins = '';
      for (let k = 0; k <= 4; k++){ const c = lerp3(p, q, k/4); ins += rod([c[0] - .12, c[1], c[2]], [c[0] + .12, c[1], c[2]], .75, PORC, tone, .4, .75, 10); }
      put(rbox(p, q, .8), ins); }
    const sx = stagger(m);
    rd([TX, m, 74.2], [TX, m, msgZ(m) + .2], .2, STEEL, tone, .4, .2, 6);                                    // suspension du porteur
    rd([TX + 4, m, 74.2], [TX + 4, m, CWZ + 1.2], .25, STEEL, tone, .4, .25, 6);                             // tube de rappel

  for (const d of [-.35, .35]) lineParts(K, ys.map(y => [TX + stagger(y) + d, y, CWZ]), '#b87333', .28, 10);
  for (let y = SLABY + 6; y < D; y += 18){ if (MASTS.some(m => Math.abs(y - m) < 6)) continue;
    K.put([[TX - .3, y - .1, CWZ + 3.4], [TX + .3, y + .1, msgZ(y)]], strk([[TX + stagger(y)*.5, y, CWZ + 3.4], [TX, y, msgZ(y)]], '#6b6152', .14));
    K.put([[TX + stagger(y) - .5, y - .1, CWZ], [TX + stagger(y) + .5, y + .1, CWZ + 3.4]], strk([[TX + stagger(y) - .35, y, CWZ], [TX + stagger(y)*.5, y, CWZ + 3.4], [TX + stagger(y) + .35, y, CWZ]], '#6b6152', .12)); }
  // the signal at the platform end, on the left of the track: a target with its lamps toward the train
  { const x = TX - 13, y = SIGY, lamps = [[0, 23.6], [-1.6, 21.2], [1.6, 21.2], [0, 18.8]];
    let s = rod([x, y, 0], [x, y, 25.5], .5, STEEL, tone, .7, .5, 8) + box(x - 3, y - .4, 16.8, x + 3, y + .4, 25.8, SOOT, tone, 1);

        s += fill(pd(on(PY(yy - .04), ellUV(x + dx, z, .85, .85, 12))), c) + (lit ? fill(pd(on(PY(yy - .05), ellUV(x + dx, z, 1.7, 1.7, 12))), c, 'opacity=".3"') : ''); }); }

/* ---------- la rame : motrice, voitures Duplex, pantographe ---------- */
const NOSE = [[0, 3.0, 6.4, 15, 2], [3, 7.4, 5.2, 18, 4.2], [8, 10.2, 4.7, 21.8, 5.4], [16, 12.2, 4.6, 26, 6], [26, 13.4, 4.9, 30.2, 6.2],
  [29.4, 13.6, 9.3, 31.4, 6.1], [38, 13.95, 9.5, 34.4, 6], [50, 14.07, 10, 38, 5.8], [62, 14.07, 10, 40.4, 5.6], [72, 14.07, 10, 41, 5.5]];
const secAt = u => { let i = 0; while (i < NOSE.length - 2 && NOSE[i + 1][0] < u) i++; const a = NOSE[i], b = NOSE[i + 1], t = clamp((u - a[0])/(b[0] - a[0]), 0, 1);
  return a.map((v, k) => v + (b[k] - v)*t); };
// the nose is two stacked parts: the white shell above ZS and, below it at the front, the dark lower shield; the split
// keeps the shell's sorting box above the bogies' wheels and the shield's box ahead of them
const ZS = 9.25, SHIELD = { l:'#6b7075', m:'#4e5357', d:'#33373a' }, NOSE_LOW = 29.4;
const rr2 = (u0, v0, u1, v1, rt, rb, n = 6) => { const lim = r => Math.max(0, Math.min(r, (u1 - u0)/2, (v1 - v0)/2)); rt = lim(rt); rb = lim(rb);
  return [...arcUV(u1 - rb, v0 + rb, rb, -90, 0, n), ...arcUV(u1 - rt, v1 - rt, rt, 0, 90, n), ...arcUV(u0 + rt, v1 - rt, rt, 90, 180, n), ...arcUV(u0 + rb, v0 + rb, rb, 180, 270, n)]; };
const prof = (w, zb, zt, r) => rrUV(TX - w, RT + zb, TX + w, RT + zt, r, 6);
const secPts = u => { const [, w, zb, zt, r] = secAt(u); return on(PY(TY(u)), rr2(TX - w, RT + Math.max(zb, ZS), TX + w, RT + zt, r, zb >= ZS ? r : .2)); };
const lowPts = u => { const [, w, zb] = secAt(u), z0 = Math.min(zb, ZS); return on(PY(TY(u)), rr2(TX - w, RT + z0, TX + w, RT + ZS, .2, Math.min(2.6, (ZS - z0)/2))); };
const PANTO_REST = 2.2;
function pantoGeom(st, pu = PANTO, k = st.panto){
  const h = PANTO_REST + (CWZ - .15 - (ROOF + 2.4) - PANTO_REST)*ease(k), z0 = ROOF + 2.4, P0 = [pu + 8, z0], Hh = [pu - 1, z0 + h];
  const L1 = 11.5, L2 = 12.5, d = Math.hypot(Hh[0] - P0[0], Hh[1] - P0[1]), a = (L1*L1 - L2*L2 + d*d)/(2*d), hh = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const ex = (Hh[0] - P0[0])/d, ez = (Hh[1] - P0[1])/d, K0 = [P0[0] + a*ex, P0[1] + a*ez], Kn = [K0[0] - hh*ez, K0[1] + hh*ex], Kk = [K0[0] + hh*ez, K0[1] - hh*ex];
  const knee = Kn[0] < Kk[0] ? Kn : Kk;                                // the knee points toward the nose
  return { P0, knee, Hh, top: z0 + h + .9 };
}
// k = how far the see-through is on: the shells fade to a ghost (so) and the insides come in (k), all sorted together
function trainParts(st, m, K, k){
  const { put, bx, rd } = K, xr = k > .001, so = 1 - .72*k, KS = wrapK(K, so), front = st.dir > 0, pw = st.power, yLim = SLABY;
  const vis0 = u => TY(u) > yLim;
  // ---- motrice: nose and body (in see-through only the ghost shows them)
  if (vis0(0)){
    let s = '';
    const uEnd = Math.min(MOT - 1.5, NY0 + SS - yLim);
    const us = [...NOSE.map(r => r[0]).filter(u => u < uEnd), Math.min(uEnd, 72), uEnd].filter((u, i, a) => a.indexOf(u) === i).sort((a, b) => a - b);
    for (let i = 0; i < us.length - 1; i++) s += loft(secPts(us[i]), secPts(us[i + 1]), n => tone(n, BODY));
    if (facing([0,1,0])) s += shape(secPts(0), tone([0,1,0], BODY), .6);
    if (uEnd >= MOT - 1.5 && facing([0,-1,0])) s += shape(secPts(MOT - 1.5), tone([0,-1,0], BODY), .8);
    // the coloured band along the side, the windscreen, the headlights, the cab side window, grilles and the cab door
    for (const sg of [1, -1]) if (facing([sg, 0, 0])){ const x = TX + sg*(MBW + .03), u0 = 40, u1 = Math.min(uEnd, 216);
      if (u1 > u0) s += shape([[x, TY(u0), RT + 12.5], [x, TY(u1), RT + 12.5], [x, TY(u1), RT + 15], [x, TY(u0), RT + 15]], m.m, .4);
      s += shape([[x, TY(56), RT + 31], [x, TY(66), RT + 31], [x, TY(66), RT + 36.6], [x, TY(56), RT + 35.4]], GLASSD, .6);
      if (uEnd > 80) s += ink(pd([[x, TY(70), RT + 17], [x, TY(77), RT + 17], [x, TY(77), RT + 36], [x, TY(70), RT + 36]]), .7);
      if (uEnd > 200){ let gr = ''; for (const [a, b] of [[92, 124], [136, 168], [176, 206]]) for (let z = RT + 29; z <= RT + 36; z += 1.4) gr += pd([[x, TY(a), z], [x, TY(b), z]], false);
        s += `<path d="${gr}" fill="none" stroke="${BODY.d}" ${mw(.3)}/>`; } }
    { const top = u => { const pts = secPts(u), c = [TX, TY(u), RT + (secAt(u)[2] + secAt(u)[3])/2]; return pts.slice(10, 18).map(p => lerp3(c, p, 1.012)); };
      const A = top(20), B = top(37.5), poly = [...B, ...A.reverse()], n = norm(cross(sub(B[0], A[A.length - 1]), sub(B[B.length - 1], B[0])));
      if (vis([0, .5, .9])) s += shape(poly, GLASSD, .8)
        + clipTo(poly, lathe(TX - 3.6, TY(45), [[RT + 22, 2], [RT + 28, 2.2], [RT + 29.5, 1.2], [RT + 30, 1.3], [RT + 32, 1.2], [RT + 32.4, .3]], NAVY, .7, 12))   // the driver, seen through it
        + strk([lerp3(A[2], B[2], .2), lerp3(A[4], B[4], .7)], '#ffffff', .35, 'round', 'opacity=".35"'); }
    for (const sg of [-1, 1]){ const c = [TX + sg*6.4, TY(5.5), RT + 13.6], n = norm([sg*.45, .85, .1]);
      if (vis(n)){ const lit = pw > .5, col = !lit ? '#d9dcdc' : front ? '#fff6c8' : '#e2483d';
        s += shape(discN(c, n, 1.25), col, .5) + (lit ? fill(pd(discN(c, n, 2.4)), col, 'opacity=".35"') : ''); } }
    // the dark lower shield under the front of the nose (its own part, below the shell, ahead of the bogie)
    { const ul = NOSE.map(r => r[0]).filter(u => u <= NOSE_LOW); let sh = '';
      for (let i = 0; i < ul.length - 1; i++) sh += loft(lowPts(ul[i]), lowPts(ul[i + 1]), n => tone(n, SHIELD));
      if (facing([0,1,0])) sh += shape(lowPts(0), tone([0,1,0], SHIELD), .6);
      if (facing([0,-1,0])) sh += shape(lowPts(NOSE_LOW), tone([0,-1,0], SHIELD), .5);
      KS.put([[TX - 13.6, TY(NOSE_LOW), RT + 4.6], [TX + 13.6, TY(0), RT + ZS]], act('train', sh + hullInk(ul.flatMap(lowPts), 1.8))); }
    const all = us.flatMap(u => secPts(u));
    s += hullInk(all, 2.2);
    KS.put([[TX - MBW, TY(uEnd), RT + 9.25], [TX + MBW, TY(0), ROOF]], act('train', s));
    // skirts between the bogies
    for (const sg of [1, -1]){ const [a, b] = xs(sg, 13.2, 13.95); for (const [u0, u1] of [[72, 150]]) if (vis0(u1)) KS.bx(a, TY(u1), RT + 4.4, b, TY(u0), RT + 9.2, BODY, tone, .7); }
  }
  // ---- motor bogies: frames and wheels
  for (const [uc, k0] of [[50, 0], [186, 1]]) bogie(st, K, uc, true);
  // ---- roof: insulators, circuit breaker, roof line, pantograph
  if (vis0(DJ + 8)){
    put([[TX - 3, TY(DJ + 6), ROOF], [TX + 3, TY(DJ - 6), ROOF + 4.6]], [[-1.6, -3.6], [1.6, 3.6]].map(([dx, du]) => lathe(TX + dx, TY(DJ + du), [[ROOF, .7], [ROOF + .6, 1.1], [ROOF + 1.1, .7], [ROOF + 1.7, 1.1], [ROOF + 2.2, .6]], PORC, .5, 10)).join('')
      + box(TX - 2.6, TY(DJ + 5), ROOF + 2.2, TX + 2.6, TY(DJ - 5), ROOF + 4.6, STEEL, tone, .8));
    lineParts(K, [[TX + 2, TY(DJ - 5), ROOF + 3.4], [TX + 2, TY(PANTO - 6), ROOF + 3.4], [TX + 2, TY(PANTO - 2), ROOF + 2.6]], '#c8792f', .45, 8); }
  if (vis0(PANTO + 10)) pantograph(st, K);                              // 1,5 kV : levé à Montparnasse
  if (vis0(PANTO_AC + 10)) pantograph(st, K, PANTO_AC, 0);              // 25 kV : replié jusqu'à la LGV
  // ---- Duplex coaches (only what is out of the slab)
  for (let i = 0; i < 4; i++){ const a = carStart(i), b = a + (i ? CAR : CAR1); if (!vis0(a)) break; coach(st, m, K, i, a, b, k); }
}
function bogie(st, K, uc, motor){
  const { put, bx } = K; if (TY(uc + 20) < SLABY) return;
  const ang = -st.s/RW;
  for (const du of [-15, 15]) K.rd(Tp(-WX0, uc + du, AZ), Tp(WX0, uc + du, AZ), .7, STEEL);
  for (const sg of [1, -1]){ const [wa, wb] = xs(sg, WX0, WX1), [fa, fb] = xs(sg, 8.1, 9.3);
    for (const du of [-15, 15]) put([[wa, TY(uc + du) - RW, RT], [wb, TY(uc + du) + RW, AZ + RW]], wheelX(wa, wb, TY(uc + du), AZ, RW, SOOT, ang));

    ...(here ? [{ at: Tp(0, g.Hh[0], g.Hh[1] + .6), text: 'PANTOGRAPHE', on: st.panto > .5 },
      { at: Tp(BW, 120, RT + 30), text: 'MOTRICE', on: mv },
      { at: Tp(BW, MOT + GAP + 60, RT + 38), text: 'VOITURE DUPLEX', on: st.boarding },
      { at: Tp(BW + .3, MOT + GAP + 20, RT + 20), text: 'PORTE', on: st.doors > .5 },
      { at: Tp(WX1, 201, AZ), text: 'BOGIE MOTEUR', on: mv }] : []),
    { at: [PE + 30, 240, QZ], text: 'QUAI', on: false },
    { at: [106, BOARDY, 37.5], text: 'TABLEAU DES DÉPARTS', on: st.voie },
    { at: [TX - 13, SIGY, 25.8], text: 'SIGNAL', on: st.sig > 0 },
    ...(st.agent ? [{ at: [st.agent.x, st.agent.y, QZ + 17], text: "AGENT D'ESCALE", on: !!st.agent.raise }] : []) ];
}
function insideLabels(st){
  const g = pantoGeom(st), here = st.phase !== 'gone' && st.fade > .5, tr = st.cur > 400;
  return [
    { at: [12, 82, 14], text: 'SOUS-STATION', on: st.cur > 0 },
    { at: [21, 99, 50], text: 'FEEDER', on: st.cur > 0 },
    { at: [TX, 230, msgZ(230)], text: 'CÂBLE PORTEUR', on: false },
    { at: [TX + stagger(270), 270, CWZ], text: 'FILS DE CONTACT', on: st.cur > 0 },
    { at: [TX - HG, 150, RT], text: 'RETOUR PAR LES RAILS', on: st.cur > 0 },
    ...(here ? [{ at: Tp(0, g.Hh[0], g.Hh[1] + .6), text: 'PANTOGRAPHE', on: st.panto > .5 },
      { at: Tp(0, DJ, ROOF - 1), text: 'DISJONCTEUR', on: st.power > .5 },
      { at: Tp(0, 125, RT + 22), text: 'FILTRE', on: st.cur > 0 },
      { at: Tp(0, 106, RT + 12), text: 'TRANSFORMATEUR', on: false },
      { at: Tp(8.5, 160, RT + 34), text: 'ONDULEURS', on: tr },
      { at: Tp(3.6, 193, AZ + 4), text: 'MOTEURS DE TRACTION', on: tr },
      { at: Tp(0, 46, RT + 25), text: 'CABINE DE CONDUITE', on: st.cur > 50 },
      { at: Tp(-9, MOT + GAP + 30, RT + 18), text: 'ESCALIER', on: st.boarding },
      { at: Tp(9, MOT + GAP + 80, RT + 30), text: 'SALLE HAUTE', on: st.boarded > 0 },
      { at: Tp(9, MOT + GAP + 70, RT + 12), text: 'SALLE BASSE', on: st.boarded > 0 }] : []) ];
}

/* ---------- la scène ---------- */
function wrapK(K, a){ const put = (b, svg) => K.put(b, a < .999 ? `<g opacity="${f(a)}">${svg}</g>` : svg);
  return { parts: K.parts, put, bx: (x0, y0, z0, x1, y1, z1, M, sh = tone, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, sh, w)),
    rd: (a1, b1, r, M, sh = tone, w = .8, r1 = r, n = 12) => put(rbox(a1, b1, r, r1), rod(a1, b1, r, M, sh, w, r1, n)) }; }
function objects(st, m, k){
  const K = kit();
  slabParts(K); substationParts(st, K); catenaryParts(st, K); platformParts(st, K); peopleParts(st, K);
  if (st.fade > .01){ const T = wrapK(K, st.fade); trainParts(st, m, T, k); if (k > .001) motriceInside(st, wrapK(T, k)); }
  if (k > .001 && st.cur > 0 && st.fade > .5){ const cp = currentPaths(st), sp = st.cur > 400 ? 1.6 : .5;      // the current's path
    flowParts(K, cp.out, AMP, sp, k); flowParts(K, cp.back, '#ff8a3d', sp, k); }
  // the far end fades into the paper: only what reaches it (the track, the train, the wires) is masked
  for (const p of K.parts) if (p.box[1][1] > D - 60) p.svg = `<g mask="url(#tgFade)">${p.svg}</g>`;
  return byDepthG(K.parts);
}
// what never moves (the fade mask, the fixed shadows, ballast and sleepers): the engine's ground layer
function groundSvg(){ return fadeDefs() + staticShadows() + `<g mask="url(#tgFade)">${trackBed()}</g>`; }
function scene(st, m){
  SS = st.s; const k = ease(st.xr || 0);
  let s = `<g mask="url(#tgFade)">${trainShadow(st) + railsSvg()}</g>` + objects(st, m, k);
  if (labelsShown()) s += lcCallouts(k > .6 ? insideLabels(st) : surfaceLabels(st));
  return s;
}
function staticShadows(){
  let s = castShadow([[0, 0, 0], [W, 0, 0], [W, SLABY, 0], [0, SLABY, 0], [0, SLABY, SLZ], [W, SLABY, SLZ], [W, 0, SLZ], [0, 0, SLZ]]);
  s += castShadow([[3, 64, 0], [21, 64, 0], [21, 100, 0], [3, 100, 0], [3, 64, 25], [21, 64, 25], [21, 100, 25], [3, 100, 25]]);
  for (const mm of MASTS) s += castShadow([[MX - 1.2, mm - .8, 0], [MX + 1.2, mm + .8, 0], [MX - 1.2, mm - .8, 80], [MX + 1.2, mm + .8, 80], [TX + 6, mm, 74.6]]);
  return s;
}
// the train's shadow, on the sleepers
function trainShadow(st){ let s = '';
  if (st.fade > .5){ const y0 = Math.max(SLABY, TY(800)), y1 = TY(0);
    s += `<g opacity="${f(st.fade)}">` + castShadow([[TX - BW, y0, TIE], [TX + BW, y0, TIE], [TX + BW, y1 - 3, TIE], [TX, y1, TIE], [TX - BW, y1 - 3, TIE], [TX - BW, y0, CROOF], [TX + BW, y0, CROOF], [TX + BW, y1 - 60, ROOF], [TX - BW, y1 - 60, ROOF], [TX, y1, RT + 15]], TIE) + `</g>`; }
  return s;
}

/* ---------- le déroulement ---------- */
const TRAINS = [{ h: '14:02', to: 'BORDEAUX ST-JEAN', n: '8501' }, { h: '14:32', to: 'NANTES', n: '8823' }, { h: '15:02', to: 'RENNES', n: '8619' }, { h: '15:32', to: 'LA ROCHELLE', n: '8381' }];
let ui, looping = false, SIM = false;
const depMin = st => { const [h, m] = TRAINS[st.train % TRAINS.length].h.split(':').map(Number); return h*60 + m; };
let pid = 0;
function newPerson(st, x, y, opts = {}){
  const k = pid++, p = { id: k, k, x, y, z: QZ, a: Math.PI/2, ph: Math.random()*6, walk: 0, shirt: matOf(CLOTH[(k*3) % 8]), pants: matOf(['#3b4250', '#5a4636', '#2a3a5c', '#6b6b6b'][k % 4]),
    bag: k % 3 !== 2 ? ['#e2483d', '#3e86d9', '#4b5563', '#f2c230', '#38a565'][k % 5] : null, path: [], speed: 9 + (k % 3)*1.5, ...opts };
  st.people.push(p); return p;
}
// each person walks along a path of [x, y, z] points; at the end, `onEnd` (board, wait)
function stepPeople(st, dt){
  for (const p of st.people){ if (p.gone) continue;
    if (p.delay > 0){ p.delay -= dt; continue; }
    if (!p.path.length){ p.walk = Math.max(0, p.walk - dt*4); continue; }
    const t = p.path[0], dx = t[0] - p.x, dy = t[1] - p.y, d = Math.hypot(dx, dy), stp = p.speed*dt;
    p.walk = Math.min(1, p.walk + dt*4); p.ph += dt*9;
    if (d > .01) p.a = Math.atan2(dy, dx);
    if (d <= stp){ p.x = t[0]; p.y = t[1]; if (t[2] != null) p.z = t[2]; p.path.shift();
      if (!p.path.length && p.board){ if (st.doors > .9){ p.gone = true; } else { p.path = []; p.wait = true; } } }
    else { p.x += dx/d*stp; p.y += dy/d*stp; if (t[2] != null) p.z += (t[2] - p.z)*Math.min(1, stp/d); } }
  // waiting at a closed door: go in when it opens
  for (const p of st.people) if (p.wait && !p.gone && st.doors > .9 && st.boarding){ p.wait = false; p.gone = true; }
  st.people = st.people.filter(p => !p.gone || p.keep);
}
const doorY = () => TY(MOT + GAP + (DOOR[0] + DOOR[1])/2);
function boardPath(p){ const yd = NY0 - (MOT + GAP + (DOOR[0] + DOOR[1])/2);
  return [[PE + 9 + (p.k % 4)*2.5, yd + 2 + (p.k % 3)*2], [PE + 3.2, yd, QZ], [PE - 1.5, yd, RT + 7.2]]; }
function tick(st, dt){
  st.clock += dt;
  // pantograph up, then the circuit breaker closes and the auxiliaries start
  if (st.pantoT != null){ st.panto = clamp(st.panto + dt/1.4*st.pantoT, 0, 1);
    if (st.pantoT > 0 && st.panto >= 1){ st.pantoT = null; st.power = 1; } else if (st.pantoT < 0 && st.panto <= 0) st.pantoT = null; }
  // doors: during boarding they open as soon as the train is powered
  if (st.boarding && st.power >= 1 && st.phase === 'idle') st.doorsWant = true;
  const dWant = st.doorsWant ? 1 : 0; st.doors = clamp(st.doors + Math.sign(dWant - st.doors)*dt/1.1, 0, 1);
  if (st.whistle > 0){ st.whistle -= dt; if (st.whistle <= 0 && st.agent) st.agent.raise = false; }
  if (st.beep > 0){ st.beep -= dt; st.doorLamp = Math.floor(st.beep*6) % 2 === 0; if (st.beep <= 0){ st.doorLamp = false; st.doorsWant = false; } }
  // boarding: people come out from under the slab, the count rises, the clock runs to two minutes before departure
  if (st.boarding){ st.spawnT -= dt;
    if (st.spawnT <= 0 && st.spawned < 9){ st.spawnT = .75; st.spawned++;
      const p = newPerson(st, PE + 14 + (st.spawned*7) % 30, SLABY + 3, { board: true }); p.path = [[p.x, SLABY + 14 + (st.spawned % 3)*3], ...boardPath(p)]; }
    if (st.doors > .9){ st.boarded = Math.min(CAP, st.boarded + dt*CAP/9); st.minute = Math.min(depMin(st) - 2.5, st.minute + dt*1.7); } }
  stepPeople(st, dt);
  // departure: the agent raises the bat, the signal clears, the driver pushes the lever; current, speed, distance
  if (st.depT != null){ st.depT += dt; const t = st.depT;
    if (t > .6) st.sig = 1;
    if (t > 1.4){ const tt = t - 1.4, acc = 9.5;
      st.cur = Math.min(2400, st.cur + dt*1800); st.v = acc*tt; st.s = acc*tt*tt/2; st.spark = Math.random() < .35 ? 1 : 0;
      st.minute = depMin(st) + tt/60;
      if (st.s > 300){ st.fade = Math.max(0, st.fade - dt/.8); if (st.fade <= 0){ st.depT = null; st.phase = 'gone'; st.cur = 0; st.v = 0; st.spark = 0; st.sig = 0; } } } }
  // next train: in place, switched off, faded in
  if (st.phase === 'arriving'){ st.fade = Math.min(1, st.fade + dt/1); if (st.fade >= 1) st.phase = 'idle'; }
  // current: auxiliaries when powered, traction when moving
  if (st.depT == null || st.depT < 1.4){ const aux = st.power ? 180 + (st.doors > 0 && st.doors < 1 ? 40 : 0) : 0; st.cur += (aux - st.cur)*Math.min(1, dt*4); if (Math.abs(st.cur - aux) < 2) st.cur = aux; }
  SS = st.s;
  return !!(st.pantoT != null || Math.abs(st.doors - (st.doorsWant ? 1 : 0)) > .001 || st.beep > 0 || st.boarding || st.depT != null || st.phase === 'arriving'
    || st.people.some(p => !p.gone && (p.path.length || p.walk > 0 || p.delay > 0)) || (st.xr > .5 && st.cur > 0));
}
function run(){ if (looping || SIM) return; looping = true; ui.animate(dt => { const b = tick(ui.st, Math.min(dt, .05)); if (!b) looping = false; return b; }); }
function raisePanto(st){
  if (st.phase === 'gone') return ui.flash('Le TGV est parti : faites venir la rame suivante');
  if (st.panto > .99 || st.pantoT > 0) return ui.flash('Le pantographe est déjà levé');
  st.pantoT = 1; run();
}
function announce(st){
  if (st.phase === 'gone') return ui.flash('Le TGV est parti : faites venir la rame suivante');
  if (st.phase !== 'idle') return ui.flash(st.phase === 'closed' ? 'Les portes sont fermées : le départ est imminent' : 'Le TGV est déjà en partance');
  if (st.voie) return ui.flash("L'embarquement est en cours");
  if (st.panto < .99){ if (st.pantoT == null) st.pantoT = 1; ui.flash('Le conducteur lève d\'abord le pantographe : les portes ont besoin du courant'); }
  st.voie = true; st.boarding = true; st.spawnT = 0; st.spawned = 0; st.minute = depMin(st) - 20; st.doorsWant = false;
